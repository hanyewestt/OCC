name: local

# Canonical OCC stack. Compose apps call service DNS/internal ports. The default
# local override adds image builds and loopback-only host ports.

x-supabase-environment: &supabase-environment
  SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL:?set the Supabase project URL}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set the Supabase JWKS URL}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_JWT_CLOCK_SKEW: ${SUPABASE_JWT_CLOCK_SKEW:-30s}
  SUPABASE_JWT_ALLOWED_ALGORITHMS: ${SUPABASE_JWT_ALLOWED_ALGORITHMS:-ES256}

x-flyway-environment: &flyway-environment
  FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
  FLYWAY_CREATE_SCHEMAS: "false"
  FLYWAY_CONNECT_RETRIES: ${OCC_DB_MIGRATION_CONNECT_RETRIES:-60}
  FLYWAY_VALIDATE_MIGRATION_NAMING: "true"

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - occ_pgdata:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-10s}

  db-bootstrap:
    image: postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119
    entrypoint: ["psql"]
    command: ["--no-psqlrc", "--host=postgres", "--username=${POSTGRES_USER:-occ_admin}", "--dbname=${POSTGRES_DB:-occ}", "--set=ON_ERROR_STOP=1", "--file=/bootstrap/bootstrap.sql"]
    restart: "no"
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set OCC_INGESTION_DB_PASSWORD in .env}
      OCC_INGESTION_DB_MIGRATOR_USERNAME: ${OCC_INGESTION_DB_MIGRATOR_USERNAME:-occ_ingestion_migrator}
      OCC_INGESTION_DB_MIGRATOR_PASSWORD: ${OCC_INGESTION_DB_MIGRATOR_PASSWORD:?set OCC_INGESTION_DB_MIGRATOR_PASSWORD in .env}
      OCC_DISRUPTION_DB_USERNAME: ${OCC_DISRUPTION_DB_USERNAME:-occ_disruption}
      OCC_DISRUPTION_DB_PASSWORD: ${OCC_DISRUPTION_DB_PASSWORD:?set OCC_DISRUPTION_DB_PASSWORD in .env}
      OCC_DISRUPTION_DB_MIGRATOR_USERNAME: ${OCC_DISRUPTION_DB_MIGRATOR_USERNAME:-occ_disruption_migrator}
      OCC_DISRUPTION_DB_MIGRATOR_PASSWORD: ${OCC_DISRUPTION_DB_MIGRATOR_PASSWORD:?set OCC_DISRUPTION_DB_MIGRATOR_PASSWORD in .env}
      OCC_PLANNING_DB_USERNAME: ${OCC_PLANNING_DB_USERNAME:-occ_planning}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set OCC_PLANNING_DB_PASSWORD in .env}
      OCC_PLANNING_DB_MIGRATOR_USERNAME: ${OCC_PLANNING_DB_MIGRATOR_USERNAME:-occ_planning_migrator}
      OCC_PLANNING_DB_MIGRATOR_PASSWORD: ${OCC_PLANNING_DB_MIGRATOR_PASSWORD:?set OCC_PLANNING_DB_MIGRATOR_PASSWORD in .env}
    volumes:
      - ./infra/postgres/bootstrap.sql:/bootstrap/bootstrap.sql:ro
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-migrate:
    image: occ-ingestion-migrations:local
    entrypoint: ["flyway"]
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *flyway-environment
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}?options=-c%20role%3Docc_ingestion_owner
      FLYWAY_USER: ${OCC_INGESTION_DB_MIGRATOR_USERNAME:-occ_ingestion_migrator}
      FLYWAY_PASSWORD: ${OCC_INGESTION_DB_MIGRATOR_PASSWORD:?set OCC_INGESTION_DB_MIGRATOR_PASSWORD in .env}
      FLYWAY_DEFAULT_SCHEMA: ingestion
      FLYWAY_SCHEMAS: ingestion
      FLYWAY_LOCATIONS: filesystem:/migrations
      FLYWAY_CALLBACK_LOCATIONS: filesystem:/callbacks
      FLYWAY_PLACEHOLDERS_OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
    networks: [database]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  disruption-migrate:
    image: occ-disruption-migrations:local
    entrypoint: ["flyway"]
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *flyway-environment
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}?options=-c%20role%3Docc_disruption_owner
      FLYWAY_USER: ${OCC_DISRUPTION_DB_MIGRATOR_USERNAME:-occ_disruption_migrator}
      FLYWAY_PASSWORD: ${OCC_DISRUPTION_DB_MIGRATOR_PASSWORD:?set OCC_DISRUPTION_DB_MIGRATOR_PASSWORD in .env}
      FLYWAY_DEFAULT_SCHEMA: disruption
      FLYWAY_SCHEMAS: disruption
      FLYWAY_LOCATIONS: filesystem:/migrations
      FLYWAY_CALLBACK_LOCATIONS: filesystem:/callbacks
      FLYWAY_PLACEHOLDERS_OCC_DISRUPTION_DB_USERNAME: ${OCC_DISRUPTION_DB_USERNAME:-occ_disruption}
    networks: [database]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  planning-migrate:
    image: occ-planning-migrations:local
    entrypoint: ["flyway"]
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *flyway-environment
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}?options=-c%20role%3Docc_planning_owner
      FLYWAY_USER: ${OCC_PLANNING_DB_MIGRATOR_USERNAME:-occ_planning_migrator}
      FLYWAY_PASSWORD: ${OCC_PLANNING_DB_MIGRATOR_PASSWORD:?set OCC_PLANNING_DB_MIGRATOR_PASSWORD in .env}
      FLYWAY_DEFAULT_SCHEMA: planning
      FLYWAY_SCHEMAS: planning
      FLYWAY_LOCATIONS: filesystem:/migrations
      FLYWAY_CALLBACK_LOCATIONS: filesystem:/callbacks
      FLYWAY_PLACEHOLDERS_OCC_PLANNING_DB_USERNAME: ${OCC_PLANNING_DB_USERNAME:-occ_planning}
    networks: [database]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

  ingestion:
    image: occ-ingestion:local
    restart: unless-stopped
    environment:
      <<: *supabase-environment
      OCC_INGESTION_INTERNAL_PORT: ${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_INGESTION_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set OCC_INGESTION_DB_PASSWORD in .env}
      OCC_INGESTION_JPA_DDL_AUTO: ${OCC_INGESTION_JPA_DDL_AUTO:-validate}
      OCC_INGESTION_MONITORED_SERVICES: ${OCC_INGESTION_MONITORED_SERVICES:-190,972}
      OCC_INGESTION_STALE_AFTER_SECONDS: ${OCC_INGESTION_STALE_AFTER_SECONDS:-180}
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL: ${OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL:-60s}
      OCC_INGESTION_BUS_ARRIVAL_INITIAL_DELAY: ${OCC_INGESTION_BUS_ARRIVAL_INITIAL_DELAY:-60s}
      OCC_INGESTION_RETENTION_INTERVAL: ${OCC_INGESTION_RETENTION_INTERVAL:-1h}
      OCC_INGESTION_RETENTION_INITIAL_DELAY: ${OCC_INGESTION_RETENTION_INITIAL_DELAY:-5m}
      OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP: ${OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP:-true}
      OCC_INGESTION_SEED_TARGETS_ON_STARTUP: ${OCC_INGESTION_SEED_TARGETS_ON_STARTUP:-true}
      OCC_INGESTION_TRAFFIC_POLL_PAGE_SIZE: ${OCC_INGESTION_TRAFFIC_POLL_PAGE_SIZE:-100}
      OCC_INGESTION_TRAFFIC_POLL_MAX_PAGE_SIZE: ${OCC_INGESTION_TRAFFIC_POLL_MAX_PAGE_SIZE:-250}
      OCC_INGESTION_DEMO_SCENARIO: ${OCC_INGESTION_DEMO_SCENARIO:-route190-bunching-v1}
      OCC_INGESTION_DEMO_SEED: ${OCC_INGESTION_DEMO_SEED:-190}
      OCC_INGESTION_DEMO_STEP_INTERVAL: ${OCC_INGESTION_DEMO_STEP_INTERVAL:-5s}
      OCC_INGESTION_DEMO_BUNCHING_THRESHOLD: ${OCC_INGESTION_DEMO_BUNCHING_THRESHOLD:-90s}
      OCC_DISRUPTION_INTERNAL_URL: http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_INGESTION_DISRUPTION_TIMEOUT: ${OCC_INGESTION_DISRUPTION_TIMEOUT:-5s}
      OCC_PLANNING_INTERNAL_URL: http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_INGESTION_PLANNING_TIMEOUT: ${OCC_INGESTION_PLANNING_TIMEOUT:-5s}
      OCC_DATAMALL_BASE_URL: ${OCC_DATAMALL_BASE_URL:-https://datamall2.mytransport.sg/ltaodataservice}
      DATAMALL_API_KEY: ${DATAMALL_API_KEY:?set DATAMALL_API_KEY in .env}
      OCC_DATAMALL_CONNECT_TIMEOUT: ${OCC_DATAMALL_CONNECT_TIMEOUT:-5s}
      OCC_DATAMALL_RESPONSE_TIMEOUT: ${OCC_DATAMALL_RESPONSE_TIMEOUT:-20s}
      OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN: ${OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_PLANNING_PEER_TOKEN: ${OCC_INGESTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN: ${OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_INGESTION_PEER_TOKEN: ${OCC_PLANNING_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_INGESTION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  disruption:
    image: occ-disruption:local
    restart: unless-stopped
    environment:
      <<: *supabase-environment
      OCC_DISRUPTION_INTERNAL_PORT: ${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_DISRUPTION_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_DISRUPTION_DB_USERNAME: ${OCC_DISRUPTION_DB_USERNAME:-occ_disruption}
      OCC_DISRUPTION_DB_PASSWORD: ${OCC_DISRUPTION_DB_PASSWORD:?set OCC_DISRUPTION_DB_PASSWORD in .env}
      OCC_DISRUPTION_CONSUMER_ENABLED: ${OCC_DISRUPTION_CONSUMER_ENABLED:-true}
      OCC_DISRUPTION_THRESHOLD: ${OCC_DISRUPTION_THRESHOLD:-90s}
      OCC_DISRUPTION_STALE_AFTER: ${OCC_DISRUPTION_STALE_AFTER:-120s}
      OCC_DISRUPTION_POLL_INTERVAL: ${OCC_DISRUPTION_POLL_INTERVAL:-1s}
      OCC_DISRUPTION_BATCH_SIZE: ${OCC_DISRUPTION_BATCH_SIZE:-100}
      OCC_DISRUPTION_RETRY_DELAY: ${OCC_DISRUPTION_RETRY_DELAY:-30s}
      OCC_DISRUPTION_EXPECTED_HEADWAY: ${OCC_DISRUPTION_EXPECTED_HEADWAY:-600s}
      OCC_DISRUPTION_INGESTION_CONNECT_TIMEOUT: ${OCC_DISRUPTION_INGESTION_CONNECT_TIMEOUT:-2s}
      OCC_DISRUPTION_INGESTION_RESPONSE_TIMEOUT: ${OCC_DISRUPTION_INGESTION_RESPONSE_TIMEOUT:-5s}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_DISRUPTION_RETENTION_INTERVAL: ${OCC_DISRUPTION_RETENTION_INTERVAL:-1h}
      OCC_DISRUPTION_RETENTION_INITIAL_DELAY: ${OCC_DISRUPTION_RETENTION_INITIAL_DELAY:-5m}
      OCC_DISRUPTION_PLANNING_INTERNAL_URL: http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_DISRUPTION_PLANNING_WORKER_ENABLED: ${OCC_DISRUPTION_PLANNING_WORKER_ENABLED:-true}
      OCC_DISRUPTION_PLANNING_DELIVERY_INTERVAL: ${OCC_DISRUPTION_PLANNING_DELIVERY_INTERVAL:-2s}
      OCC_DISRUPTION_PLANNING_REQUEST_TIMEOUT: ${OCC_DISRUPTION_PLANNING_REQUEST_TIMEOUT:-5s}
      OCC_DISRUPTION_PLANNING_LEASE_DURATION: ${OCC_DISRUPTION_PLANNING_LEASE_DURATION:-1m}
      OCC_DISRUPTION_PLANNING_BATCH_SIZE: ${OCC_DISRUPTION_PLANNING_BATCH_SIZE:-10}
      OCC_DISRUPTION_PLANNING_MAX_ATTEMPTS: ${OCC_DISRUPTION_PLANNING_MAX_ATTEMPTS:-0}
      OCC_DISRUPTION_PLANNING_RETRY_INITIAL_DELAY: ${OCC_DISRUPTION_PLANNING_RETRY_INITIAL_DELAY:-2s}
      OCC_DISRUPTION_PLANNING_RETRY_MAX_DELAY: ${OCC_DISRUPTION_PLANNING_RETRY_MAX_DELAY:-1m}
      OCC_DISRUPTION_TRAFFIC_POLL_ENABLED: ${OCC_DISRUPTION_TRAFFIC_POLL_ENABLED:-true}
      OCC_DISRUPTION_TRAFFIC_POLL_INTERVAL: ${OCC_DISRUPTION_TRAFFIC_POLL_INTERVAL:-10s}
      OCC_DISRUPTION_TRAFFIC_POLL_PAGE_SIZE: ${OCC_DISRUPTION_TRAFFIC_POLL_PAGE_SIZE:-100}
      OCC_DISRUPTION_TRAFFIC_STALE_AFTER: ${OCC_DISRUPTION_TRAFFIC_STALE_AFTER:-5m}
      OCC_DISRUPTION_TRAFFIC_CLEAR_AFTER_SUCCESSFUL_ABSENCES: ${OCC_DISRUPTION_TRAFFIC_CLEAR_AFTER_SUCCESSFUL_ABSENCES:-2}
      OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN: ${OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN: ${OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN: ${OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN: ${OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      disruption-migrate:
        condition: service_completed_successfully
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_DISRUPTION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  planning:
    image: occ-planning:local
    restart: unless-stopped
    environment:
      <<: *supabase-environment
      OCC_PLANNING_INTERNAL_PORT: ${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_PLANNING_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_PLANNING_DB_USERNAME: ${OCC_PLANNING_DB_USERNAME:-occ_planning}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set OCC_PLANNING_DB_PASSWORD in .env}
      OCC_DISRUPTION_INTERNAL_URL: http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_PLANNING_RECOMMENDATION_AUDIT_MAX_RESPONSE_CHARACTERS: ${OCC_PLANNING_RECOMMENDATION_AUDIT_MAX_RESPONSE_CHARACTERS:-65536}
      OCC_PLANNING_RECOMMENDATION_MAX_PROMPT_INPUT_BYTES: ${OCC_PLANNING_RECOMMENDATION_MAX_PROMPT_INPUT_BYTES:-65536}
      OCC_PLANNING_RECOMMENDATION_AI_ENABLED: ${OCC_PLANNING_RECOMMENDATION_AI_ENABLED:-false}
      OCC_PLANNING_RECOMMENDATION_FIXTURE_LOCATION: ${OCC_PLANNING_RECOMMENDATION_FIXTURE_LOCATION:-classpath:fixtures/bunching-mitigation-context.json}
      OCC_PLANNING_GEMINI_API_KEY: ${OCC_PLANNING_GEMINI_API_KEY:-}
      OCC_PLANNING_GEMINI_MODEL: ${OCC_PLANNING_GEMINI_MODEL:-gemini-3.1-flash-lite}
      OCC_PLANNING_GEMINI_TEMPERATURE: ${OCC_PLANNING_GEMINI_TEMPERATURE:-1.0}
      OCC_PLANNING_RECOMMENDATION_GEMINI_MAX_OUTPUT_TOKENS: ${OCC_PLANNING_RECOMMENDATION_GEMINI_MAX_OUTPUT_TOKENS:-512}
      OCC_PLANNING_GEMINI_THINKING_LEVEL: ${OCC_PLANNING_GEMINI_THINKING_LEVEL:-MINIMAL}
      OCC_PLANNING_GEMINI_REQUEST_TIMEOUT: ${OCC_PLANNING_GEMINI_REQUEST_TIMEOUT:-30s}
      OCC_PLANNING_GEMINI_RETRY_ATTEMPTS: ${OCC_PLANNING_GEMINI_RETRY_ATTEMPTS:-2}
      OCC_PLANNING_DIAGNOSIS_RETENTION_INTERVAL: ${OCC_PLANNING_DIAGNOSIS_RETENTION_INTERVAL:-1h}
      OCC_PLANNING_DIAGNOSIS_RETENTION_INITIAL_DELAY: ${OCC_PLANNING_DIAGNOSIS_RETENTION_INITIAL_DELAY:-5m}
      OCC_PLANNING_DIAGNOSIS_AUDIT_MAX_RESPONSE_CHARACTERS: ${OCC_PLANNING_DIAGNOSIS_AUDIT_MAX_RESPONSE_CHARACTERS:-65536}
      OCC_PLANNING_DIAGNOSIS_WORKER_ENABLED: ${OCC_PLANNING_DIAGNOSIS_WORKER_ENABLED:-true}
      OCC_PLANNING_DIAGNOSIS_WORKER_INTERVAL: ${OCC_PLANNING_DIAGNOSIS_WORKER_INTERVAL:-2s}
      OCC_PLANNING_DIAGNOSIS_WORKER_BATCH_SIZE: ${OCC_PLANNING_DIAGNOSIS_WORKER_BATCH_SIZE:-10}
      OCC_PLANNING_DIAGNOSIS_LEASE_DURATION: ${OCC_PLANNING_DIAGNOSIS_LEASE_DURATION:-5m}
      OCC_PLANNING_DIAGNOSIS_MAX_ATTEMPTS: ${OCC_PLANNING_DIAGNOSIS_MAX_ATTEMPTS:-3}
      OCC_PLANNING_DIAGNOSIS_DELIVERY_MAX_ATTEMPTS: ${OCC_PLANNING_DIAGNOSIS_DELIVERY_MAX_ATTEMPTS:-0}
      OCC_PLANNING_DIAGNOSIS_RETRY_INITIAL_DELAY: ${OCC_PLANNING_DIAGNOSIS_RETRY_INITIAL_DELAY:-2s}
      OCC_PLANNING_DIAGNOSIS_RETRY_MAX_DELAY: ${OCC_PLANNING_DIAGNOSIS_RETRY_MAX_DELAY:-1m}
      OCC_PLANNING_DIAGNOSIS_EVIDENCE_LOOKBACK: ${OCC_PLANNING_DIAGNOSIS_EVIDENCE_LOOKBACK:-15m}
      OCC_PLANNING_DIAGNOSIS_EVIDENCE_RADIUS_KM: ${OCC_PLANNING_DIAGNOSIS_EVIDENCE_RADIUS_KM:-2.0}
      OCC_PLANNING_DIAGNOSIS_CONFIDENCE_THRESHOLD: ${OCC_PLANNING_DIAGNOSIS_CONFIDENCE_THRESHOLD:-0.70}
      OCC_PLANNING_DIAGNOSIS_REQUEST_TIMEOUT: ${OCC_PLANNING_DIAGNOSIS_REQUEST_TIMEOUT:-10s}
      OCC_PLANNING_DIAGNOSIS_PEER_RESPONSE_MAX_BYTES: ${OCC_PLANNING_DIAGNOSIS_PEER_RESPONSE_MAX_BYTES:-131072}
      OCC_PLANNING_DIAGNOSIS_MAX_PROMPT_INPUT_BYTES: ${OCC_PLANNING_DIAGNOSIS_MAX_PROMPT_INPUT_BYTES:-65536}
      OCC_PLANNING_DIAGNOSIS_GEMINI_MAX_OUTPUT_TOKENS: ${OCC_PLANNING_DIAGNOSIS_GEMINI_MAX_OUTPUT_TOKENS:-1024}
      OCC_PLANNING_SWAGGER_ENABLED: ${OCC_PLANNING_SWAGGER_ENABLED:-true}
      OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN: ${OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_PLANNING_PEER_TOKEN: ${OCC_INGESTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_INGESTION_PEER_TOKEN: ${OCC_PLANNING_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN: ${OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      planning-migrate:
        condition: service_completed_successfully
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_PLANNING_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  gateway:
    image: occ-gateway:local
    restart: unless-stopped
    environment:
      <<: *supabase-environment
      OCC_GATEWAY_INTERNAL_PORT: ${OCC_GATEWAY_INTERNAL_PORT:-8004}
      OCC_GATEWAY_AUTH_TEST_ENABLED: ${OCC_GATEWAY_AUTH_TEST_ENABLED:-true}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_DISRUPTION_INTERNAL_URL: http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_PLANNING_INTERNAL_URL: http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}
    networks: [edge, app, egress]
    depends_on:
      ingestion:
        condition: service_healthy
      disruption:
        condition: service_healthy
      planning:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_GATEWAY_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - occ_pgadmin:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  occ_pgdata:
  occ_pgadmin:

networks:
  edge:
    # Nginx needs a host-published ingress port; only Nginx publishes one.
    internal: false
  app:
  database:
    internal: true
  egress:
