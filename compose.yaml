name: local

# Canonical OCC stack. Compose apps call service DNS/internal ports. The default
# local override adds image builds and loopback-only host ports.

x-supabase-environment: &supabase-environment
  SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL:?set the Supabase project URL}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set the Supabase JWKS URL}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_JWT_CLOCK_SKEW: ${SUPABASE_JWT_CLOCK_SKEW:-30s}
  SUPABASE_JWT_ALLOWED_ALGORITHMS: ${SUPABASE_JWT_ALLOWED_ALGORITHMS:-ES256}

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    # The image defaults to 128MB; this stack is read-heavy and does not need it.
    command: ["postgres", "-c", "shared_buffers=${OCC_POSTGRES_SHARED_BUFFERS:-64MB}"]
    volumes:
      - occ_pgdata:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Explicitly run with `docker compose run --rm db-setup` before applications.
  db-setup:
    image: occ-db-setup:local
    profiles: [setup]
    restart: "no"
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set OCC_INGESTION_DB_PASSWORD in .env}
      OCC_INGESTION_DB_MIGRATOR_USERNAME: ${OCC_INGESTION_DB_MIGRATOR_USERNAME:-occ_ingestion_migrator}
      OCC_INGESTION_DB_MIGRATOR_PASSWORD: ${OCC_INGESTION_DB_MIGRATOR_PASSWORD:?set OCC_INGESTION_DB_MIGRATOR_PASSWORD in .env}
      OCC_DISRUPTION_DB_USERNAME: ${OCC_DISRUPTION_DB_USERNAME:-occ_disruption}
      OCC_DISRUPTION_DB_PASSWORD: ${OCC_DISRUPTION_DB_PASSWORD:?set OCC_DISRUPTION_DB_PASSWORD in .env}
      OCC_DISRUPTION_DB_MIGRATOR_USERNAME: ${OCC_DISRUPTION_DB_MIGRATOR_USERNAME:-occ_disruption_migrator}
      OCC_DISRUPTION_DB_MIGRATOR_PASSWORD: ${OCC_DISRUPTION_DB_MIGRATOR_PASSWORD:?set OCC_DISRUPTION_DB_MIGRATOR_PASSWORD in .env}
      OCC_PLANNING_DB_USERNAME: ${OCC_PLANNING_DB_USERNAME:-occ_planning}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set OCC_PLANNING_DB_PASSWORD in .env}
      OCC_PLANNING_DB_MIGRATOR_USERNAME: ${OCC_PLANNING_DB_MIGRATOR_USERNAME:-occ_planning_migrator}
      OCC_PLANNING_DB_MIGRATOR_PASSWORD: ${OCC_PLANNING_DB_MIGRATOR_PASSWORD:?set OCC_PLANNING_DB_MIGRATOR_PASSWORD in .env}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    image: occ-ingestion:local
    restart: unless-stopped
    mem_limit: ${OCC_INGESTION_MEMORY_LIMIT:-640m}
    environment:
      <<: *supabase-environment
      JAVA_TOOL_OPTIONS: ${OCC_INGESTION_JAVA_TOOL_OPTIONS:--Xms32m -Xmx192m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1}
      MALLOC_ARENA_MAX: "2"
      OCC_INGESTION_INTERNAL_PORT: ${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_AUDIT_RETENTION: ${OCC_AUDIT_RETENTION:-90d}
      OCC_IDENTITY_ENABLED: ${OCC_IDENTITY_ENABLED:-false}
      OCC_IDENTITY_SECRET_KEY: ${OCC_IDENTITY_SECRET_KEY:-}
      OCC_IDENTITY_SECRET_KEY_FILE: ${OCC_IDENTITY_SECRET_KEY_FILE:-}
      OCC_IDENTITY_TIMEOUT: ${OCC_IDENTITY_TIMEOUT:-5s}
      OCC_IDENTITY_DIRECTORY_INTERVAL: ${OCC_IDENTITY_DIRECTORY_INTERVAL:-5m}
      OCC_INGESTION_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set OCC_INGESTION_DB_PASSWORD in .env}
      OCC_INGESTION_MONITORED_SERVICES: ${OCC_INGESTION_MONITORED_SERVICES:-190,972}
      OCC_DEMO_CAPTAIN_USER_ID: ${OCC_DEMO_CAPTAIN_USER_ID:-}
      OCC_INGESTION_STATION_REFERENCE_LOCATION: ${OCC_INGESTION_STATION_REFERENCE_LOCATION:-}
      OCC_DISRUPTION_INTERNAL_URL: http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_PLANNING_INTERNAL_URL: http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_DATAMALL_BASE_URL: ${OCC_DATAMALL_BASE_URL:-https://datamall2.mytransport.sg/ltaodataservice}
      DATAMALL_API_KEY: ${DATAMALL_API_KEY:?set DATAMALL_API_KEY in .env}
      # Relocated public browser configuration (formerly served by Gateway).
      SUPABASE_SB_PUBLISHABLE: ${SUPABASE_SB_PUBLISHABLE:-}
      OCC_CONTROLLER_DATA_REFRESH_INTERVAL: ${OCC_CONTROLLER_DATA_REFRESH_INTERVAL:-30s}
      OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL: ${OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL:-60s}
      OCC_ROUTE_INCIDENT_GAP_TOLERANCE: ${OCC_ROUTE_INCIDENT_GAP_TOLERANCE:-20s}
      OCC_CAPTAIN_DATA_REFRESH_INTERVAL: ${OCC_CAPTAIN_DATA_REFRESH_INTERVAL:-5s}
      OCC_PUBLIC_NOTICE_REFRESH_INTERVAL: ${OCC_PUBLIC_NOTICE_REFRESH_INTERVAL:-30s}
      OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN: ${OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_PLANNING_PEER_TOKEN: ${OCC_INGESTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN: ${OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_INGESTION_PEER_TOKEN: ${OCC_PLANNING_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_INGESTION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  disruption:
    image: occ-disruption:local
    restart: unless-stopped
    mem_limit: ${OCC_DISRUPTION_MEMORY_LIMIT:-512m}
    environment:
      <<: *supabase-environment
      JAVA_TOOL_OPTIONS: ${OCC_DISRUPTION_JAVA_TOOL_OPTIONS:--Xms32m -Xmx192m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1}
      MALLOC_ARENA_MAX: "2"
      OCC_DISRUPTION_INTERNAL_PORT: ${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_AUDIT_RETENTION: ${OCC_AUDIT_RETENTION:-90d}
      OCC_DISRUPTION_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_DISRUPTION_DB_USERNAME: ${OCC_DISRUPTION_DB_USERNAME:-occ_disruption}
      OCC_DISRUPTION_DB_PASSWORD: ${OCC_DISRUPTION_DB_PASSWORD:?set OCC_DISRUPTION_DB_PASSWORD in .env}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_DISRUPTION_PLANNING_INTERNAL_URL: http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN: ${OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN: ${OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN: ${OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN: ${OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_DISRUPTION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  planning:
    image: occ-planning:local
    restart: unless-stopped
    mem_limit: ${OCC_PLANNING_MEMORY_LIMIT:-512m}
    environment:
      <<: *supabase-environment
      JAVA_TOOL_OPTIONS: ${OCC_PLANNING_JAVA_TOOL_OPTIONS:--Xms32m -Xmx192m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1}
      MALLOC_ARENA_MAX: "2"
      OCC_PLANNING_INTERNAL_PORT: ${OCC_PLANNING_INTERNAL_PORT:-8003}
      OCC_AUDIT_RETENTION: ${OCC_AUDIT_RETENTION:-90d}
      OCC_PLANNING_ASSIGNMENT_RECOVERY_INTERVAL: ${OCC_PLANNING_ASSIGNMENT_RECOVERY_INTERVAL:-5s}
      OCC_PLANNING_ASSIGNMENT_RECOVERY_BATCH_SIZE: ${OCC_PLANNING_ASSIGNMENT_RECOVERY_BATCH_SIZE:-25}
      OCC_PLANNING_DB_INTERNAL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_PLANNING_DB_USERNAME: ${OCC_PLANNING_DB_USERNAME:-occ_planning}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set OCC_PLANNING_DB_PASSWORD in .env}
      OCC_PLANNING_RECOMMENDATION_AI_ENABLED: ${OCC_PLANNING_RECOMMENDATION_AI_ENABLED:-true}
      OCC_PLANNING_DIAGNOSIS_AUTO_PROCESS_BUNCHING: ${OCC_PLANNING_DIAGNOSIS_AUTO_PROCESS_BUNCHING:-false}
      OCC_PLANNING_GEMINI_API_KEY: ${OCC_PLANNING_GEMINI_API_KEY:-}
      OCC_PLANNING_GEMINI_BASE_URL: ${OCC_PLANNING_GEMINI_BASE_URL:-}
      OCC_PLANNING_GEMINI_MODEL: ${OCC_PLANNING_GEMINI_MODEL:-gemini-3.1-flash-lite}
      OCC_PLANNING_RECOMMENDATION_FIXTURE_LOCATION: ${OCC_PLANNING_RECOMMENDATION_FIXTURE_LOCATION:-classpath:fixtures/bunching-mitigation-context.json}
      OCC_DISRUPTION_INTERNAL_URL: http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN: ${OCC_DISRUPTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_INGESTION_TO_PLANNING_PEER_TOKEN: ${OCC_INGESTION_TO_PLANNING_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_INGESTION_PEER_TOKEN: ${OCC_PLANNING_TO_INGESTION_PEER_TOKEN:?set peer token in .env}
      OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN: ${OCC_PLANNING_TO_DISRUPTION_PEER_TOKEN:?set peer token in .env}
    networks: [app, database, egress]
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_PLANNING_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  nginx:
    profiles: [edge]
    image: nginx:1.30.6-alpine-slim@sha256:f65ed258206d1eb6c4eb6141111715a2cf94ac0a4ec9675fc2da186f7aadb163
    user: "101:101"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    environment:
      NGINX_ENVSUBST_FILTER: '^(OCC_INGESTION_INTERNAL_URL|OCC_DISRUPTION_INTERNAL_URL|OCC_PLANNING_INTERNAL_URL|OCC_PGADMIN_INTERNAL_URL|OCC_NGINX_HTTP_INTERNAL_PORT|OCC_NGINX_HTTPS_INTERNAL_PORT|OCC_NGINX_SERVER_NAME)$'
      OCC_INGESTION_INTERNAL_URL: ${OCC_INGESTION_INTERNAL_URL:-http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}}
      OCC_DISRUPTION_INTERNAL_URL: ${OCC_DISRUPTION_INTERNAL_URL:-http://disruption:${OCC_DISRUPTION_INTERNAL_PORT:-8002}}
      OCC_PLANNING_INTERNAL_URL: ${OCC_PLANNING_INTERNAL_URL:-http://planning:${OCC_PLANNING_INTERNAL_PORT:-8003}}
      OCC_NGINX_HTTP_INTERNAL_PORT: ${OCC_NGINX_HTTP_INTERNAL_PORT:-8080}
      OCC_NGINX_HTTPS_INTERNAL_PORT: ${OCC_NGINX_HTTPS_INTERNAL_PORT:-8443}
      OCC_NGINX_SERVER_NAME: ${OCC_NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./infra/nginx/routes.inc.template:/etc/nginx/templates/routes.inc.template:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    # Nginx reaches all three backends on the application network; it stays off
    # the private database network.
    networks: [edge, app]
    depends_on:
      ingestion:
        condition: service_healthy
      disruption:
        condition: service_healthy
      planning:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - occ_pgadmin:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  occ_pgdata:
  occ_pgadmin:

networks:
  edge:
    # Nginx needs a host-published ingress port; only Nginx publishes one.
    internal: false
  app:
  database:
    internal: true
  egress:
