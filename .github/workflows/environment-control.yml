name: Environment control

# Manual lifecycle controls for the EC2 deployment: start/resume, pause and
# status. Mutating controls share the production mutation queue with the
# release/deploy workflow and reconcile outstanding remote operations before
# acting; status is read-only. There is no recurring schedule and no implicit
# wake: only explicit start/resume runs the instance.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Lifecycle action: start (alias: resume), pause or status'
        required: true
        type: choice
        options:
          - start
          - resume
          - pause
          - status
        default: status

permissions:
  contents: read
  id-token: write

concurrency:
  # Mutating controls serialize with deploy/publish mutations; status would
  # not race anything but shares the group so reports never queue behind
  # themselves across overlapping dispatches.
  group: occ-production-mutation
  cancel-in-progress: false

env:
  OCC_REGION: ${{ secrets.OCC_REGION }}
  OCC_RELEASE_BUCKET: ${{ secrets.OCC_RELEASE_BUCKET }}

jobs:
  control:
    name: Environment control (${{ inputs.action }})
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out the CD tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.OCC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.OCC_REGION }}

      - name: Run the lifecycle action
        run: >-
          python3 scripts/cd/environment.py "${{ inputs.action }}"
          --region "${{ secrets.OCC_REGION }}"
          --instance-id "${{ secrets.OCC_INSTANCE_ID }}"
          --bucket "${{ secrets.OCC_RELEASE_BUCKET }}"
          --operation-id "${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Summarize the control outcome
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Environment control: ${{ inputs.action }}"
            echo "- outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
