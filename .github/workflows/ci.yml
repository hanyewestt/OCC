name: OCC CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occ-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion
            directory: services/ingestion
          - service: bus-bunching-detection
            directory: services/operations/bus-bunching-detection
          - service: recommendation-engine
            directory: services/planning/recommendation-engine
          - service: root-cause-diagnosis
            directory: services/planning/root-cause-diagnosis
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            ${{ matrix.directory }}/pom.xml
            ${{ matrix.directory }}/.mvn/wrapper/maven-wrapper.properties
      - name: Check Docker availability
        run: docker info
      - name: Verify report checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build and run tests
        working-directory: ${{ matrix.directory }}
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Check test execution and write summary
        if: ${{ !cancelled() }}
        env:
          SERVICE_DIRECTORY: ${{ matrix.directory }}
        run: python3 .github/scripts/check_test_reports.py "$SERVICE_DIRECTORY"
      - name: Build Docker image
        working-directory: ${{ matrix.directory }}
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: docker build --tag "occ-${SERVICE_NAME}:ci" .
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            ${{ matrix.directory }}/target/surefire-reports/
            ${{ matrix.directory }}/target/failsafe-reports/
          if-no-files-found: warn
