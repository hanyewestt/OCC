name: System verification runner

on:
  workflow_call:
    inputs:
      suite:
        description: 'smoke, contracts or extended; selected by the calling workflow'
        required: true
        type: string

permissions:
  contents: read

jobs:
  system:
    name: System verification
    runs-on: ubuntu-24.04
    env:
      OCC_SYSTEM_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React static assets
        if: inputs.suite != 'contracts'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start isolated application stack
        run: >-
          docker compose -p occ-edge-ci --env-file .env.example
          -f compose.yaml -f infra/compose.test.yaml up -d --build --wait
      - name: Configure an ephemeral local JWKS issuer for end-to-end role checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/system/create_es256_auth_fixtures.mjs "$RUNNER_TEMP/occ-edge-jwks"
          cat > "$RUNNER_TEMP/occ-edge-nginx.conf" <<'EOF'
          worker_processes 1;
          pid /tmp/nginx.pid;
          error_log /dev/stderr notice;
          events { worker_connections 1024; }
          http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log /dev/stdout;
            client_body_temp_path /tmp/client_body_temp;
            proxy_temp_path /tmp/proxy_temp;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;
            include /etc/nginx/conf.d/*.conf;
          }
          EOF
          chmod 644 "$RUNNER_TEMP/occ-edge-nginx.conf"
          docker run --detach --name occ-edge-ci-jwks \
            --user 101:101 --read-only --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs /tmp:uid=101,gid=101,mode=1777 \
            --network occ-edge-ci_egress --network-alias jwks-test \
            --mount "type=bind,source=$RUNNER_TEMP/occ-edge-jwks/auth/v1/.well-known,target=/var/www,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/system/provider_stubs.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/occ-edge-nginx.conf,target=/etc/nginx/nginx.conf,readonly" \
            --entrypoint nginx \
            nginx:1.30.6-alpine-slim@sha256:3028fc1419f99b95c1c69f844bbaf49dc1b881750c51b497fc721ac4f02a14e6 -g 'daemon off;'
          jwks_ready=false
          for attempt in $(seq 1 30); do
            if docker compose -p occ-edge-ci --env-file .env.example \
              -f compose.yaml -f infra/compose.test.yaml exec -T gateway \
              curl --fail --silent http://jwks-test:8080/auth/v1/.well-known/jwks.json >/dev/null; then
              jwks_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$jwks_ready" != true ]]; then
            docker logs occ-edge-ci-jwks
            exit 1
          fi
          compose=(docker compose -p occ-edge-ci --env-file .env.example
            -f compose.yaml -f infra/compose.test.yaml)
          services=(gateway ingestion disruption planning)
          if [[ "$OCC_SYSTEM_SUITE" == extended ]]; then
            compose+=(-f infra/compose.workflow-test.yaml -f infra/compose.dispatch-test.yaml)
            services+=(planning-fault-proxy)
          fi
          SUPABASE_PROJECT_URL=http://jwks-test:8080 \
          SUPABASE_JWKS_URL=http://jwks-test:8080/auth/v1/.well-known/jwks.json \
            "${compose[@]}" up -d --force-recreate --wait "${services[@]}"
      - name: Start pinned Nginx edge with a disposable test certificate
        if: inputs.suite != 'contracts'
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$RUNNER_TEMP/occ-edge-test.key" \
            -out "$RUNNER_TEMP/occ-edge-test.crt" \
            -subj "/CN=localhost"
          chmod 644 "$RUNNER_TEMP/occ-edge-test.key" "$RUNNER_TEMP/occ-edge-test.crt"
          docker run --detach --name occ-edge-ci-nginx \
            --user 101:101 --read-only --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs /etc/nginx/conf.d:uid=101,gid=101,mode=1777 \
            --tmpfs /tmp:uid=101,gid=101,mode=1777 \
            --network occ-edge-ci_edge --publish 127.0.0.1:18443:8443 \
            --env 'NGINX_ENVSUBST_FILTER=^(OCC_GATEWAY_INTERNAL_URL|OCC_NGINX_DNS_VALIDITY|OCC_NGINX_HTTP_INTERNAL_PORT|OCC_NGINX_HTTPS_INTERNAL_PORT|OCC_NGINX_SERVER_NAME|OCC_NGINX_CLIENT_MAX_BODY_SIZE|OCC_NGINX_RATE_LIMIT_PER_SECOND|OCC_NGINX_RATE_LIMIT_BURST|OCC_NGINX_RATE_LIMIT_ZONE_SIZE|OCC_NGINX_PROXY_CONNECT_TIMEOUT|OCC_NGINX_PROXY_READ_TIMEOUT|OCC_NGINX_PROXY_SEND_TIMEOUT)$' \
            --env OCC_GATEWAY_INTERNAL_URL=http://gateway:8004 \
            --env OCC_NGINX_DNS_VALIDITY=30s \
            --env OCC_NGINX_HTTPS_INTERNAL_PORT=8443 \
            --env OCC_NGINX_SERVER_NAME=localhost \
            --env OCC_NGINX_CLIENT_MAX_BODY_SIZE=1m \
            --env OCC_NGINX_RATE_LIMIT_PER_SECOND=20r/s \
            --env OCC_NGINX_RATE_LIMIT_BURST=40 \
            --env OCC_NGINX_RATE_LIMIT_ZONE_SIZE=10m \
            --env OCC_NGINX_PROXY_CONNECT_TIMEOUT=5s \
            --env OCC_NGINX_PROXY_READ_TIMEOUT=30s \
            --env OCC_NGINX_PROXY_SEND_TIMEOUT=30s \
            --mount "type=bind,source=$GITHUB_WORKSPACE/infra/nginx/routes.inc.template,target=/etc/nginx/templates/routes.inc.template,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/frontend/dist,target=/usr/share/nginx/html,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/infra/nginx/default.conf.template,target=/etc/nginx/templates/default.conf.template,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/occ-edge-nginx.conf,target=/etc/nginx/nginx.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/occ-edge-test.crt,target=/run/secrets/occ_tls_certificate,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/occ-edge-test.key,target=/run/secrets/occ_tls_private_key,readonly" \
            nginx:1.30.6-alpine-slim@sha256:3028fc1419f99b95c1c69f844bbaf49dc1b881750c51b497fc721ac4f02a14e6
          for attempt in $(seq 1 30); do
            status=$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' \
              https://127.0.0.1:18443/_occ_edge_health || true)
            if [[ "$status" == 204 ]]; then
              exit 0
            fi
            sleep 2
          done
          docker logs occ-edge-ci-nginx
          exit 1
      - name: Start local HTTP edge using the normal Compose configuration
        if: inputs.suite == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p occ-edge-ci --env-file .env.example -f compose.yaml \
            -f compose.override.yaml -f infra/compose.test.yaml \
            run --detach --no-deps --name occ-edge-ci-http --publish 127.0.0.1:18480:8080 nginx
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18480/_occ_edge_health; then
              exit 0
            fi
            sleep 2
          done
          docker logs occ-edge-ci-http
          exit 1
      - name: Verify OpenAPI comparison gate detects deleted operations
        if: inputs.suite == 'contracts'
        run: python3 tests/system/openapi_runtime_contract_smoke.py --self-test
      - name: Export and compare live service OpenAPI contracts
        if: inputs.suite == 'contracts'
        run: >-
          python3 tests/system/openapi_runtime_contract_smoke.py
          --compose-project occ-edge-ci
          --env-file .env.example
          --token-file "$RUNNER_TEMP/occ-edge-jwks/admin.jwt"
      - name: Verify traffic incident lifecycle through the application
        if: inputs.suite == 'extended'
        run: >-
          python3 tests/system/traffic_incident_workflow_smoke.py
          --base-url https://127.0.0.1:18443
          --token-file "$RUNNER_TEMP/occ-edge-jwks/admin.jwt"
          --compose-project occ-edge-ci
      - name: Verify receiver-commit retry and restart recovery
        if: inputs.suite == 'extended'
        run: >-
          python3 tests/system/dispatch_recovery_smoke.py --base-url https://127.0.0.1:18443
          --token-dir "$RUNNER_TEMP/occ-edge-jwks" --compose-project occ-edge-ci
      - name: Produce a deterministic recommendation and measure async readiness
        if: inputs.suite == 'extended'
        run: >-
          python3 tests/system/demo_workflow_smoke.py
          --base-url https://127.0.0.1:18443
          --token-dir "$RUNNER_TEMP/occ-edge-jwks"
          --result-file "$RUNNER_TEMP/occ-api-performance-context.json"
      # The workflow above warms the synthetic JWKS and provides valid recommendation IDs.
      - name: Measure important authenticated API endpoints with k6
        if: inputs.suite == 'extended'
        shell: bash
        run: |
          set -euo pipefail
          admin_token="$(cat "$RUNNER_TEMP/occ-edge-jwks/admin.jwt")"
          demo_run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["demoRunId"])' "$RUNNER_TEMP/occ-api-performance-context.json")"
          bunching_event_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bunchingEventId"])' "$RUNNER_TEMP/occ-api-performance-context.json")"
          docker run --rm --network occ-edge-ci_edge \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/system/important_api_performance.js,target=/work/important_api_performance.js,readonly" \
            grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34 \
            run \
            -e OCC_PHASE1_K6_BASE_URL=https://occ-edge-ci-nginx:8443 \
            -e "OCC_PHASE1_K6_ADMIN_TOKEN=$admin_token" \
            -e "OCC_PHASE1_K6_DEMO_RUN_ID=$demo_run_id" \
            -e "OCC_PHASE1_K6_BUNCHING_EVENT_ID=$bunching_event_id" \
            -e OCC_PHASE1_K6_VIRTUAL_USERS=4 \
            -e OCC_PHASE1_K6_DURATION=15s \
            -e OCC_PHASE1_K6_P95_TARGET_MS=2000 \
            -e OCC_PHASE1_K6_ERROR_RATE_LIMIT=0.01 \
            /work/important_api_performance.js
      - name: Verify TLS edge routing, access boundaries and rate limiting
        if: inputs.suite == 'smoke'
        run: >-
          python3 tests/system/nginx_edge_smoke.py --base-url https://127.0.0.1:18443
          --token-dir "$RUNNER_TEMP/occ-edge-jwks"
      - name: Verify React auth journeys through HTTPS Nginx
        if: inputs.suite == 'smoke'
        working-directory: frontend
        env:
          OCC_FRONTEND_TEST_PUBLIC_URL: https://127.0.0.1:18443
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Verify local HTTP frontend and authentication boundaries
        if: inputs.suite == 'smoke'
        run: >-
          python3 tests/system/nginx_edge_smoke.py --base-url http://127.0.0.1:18480
          --token-dir "$RUNNER_TEMP/occ-edge-jwks"
      - name: Verify static pages without backend hosting
        if: inputs.suite == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p occ-edge-ci --env-file .env.example -f compose.yaml -f infra/compose.test.yaml)
          trap '"${compose[@]}" start gateway' EXIT
          "${compose[@]}" stop gateway
          python3 tests/system/nginx_edge_smoke.py --base-url https://127.0.0.1:18443 --static-only
          python3 tests/system/nginx_edge_smoke.py --base-url http://127.0.0.1:18480 --static-only
      - name: Remove disposable containers and networks
        if: always()
        run: |
          docker rm --force occ-edge-ci-nginx 2>/dev/null || true
          docker rm --force occ-edge-ci-http 2>/dev/null || true
          docker rm --force occ-edge-ci-jwks 2>/dev/null || true
          docker compose -p occ-edge-ci --env-file .env.example \
            -f compose.yaml -f infra/compose.test.yaml -f infra/compose.workflow-test.yaml \
            -f infra/compose.dispatch-test.yaml down --remove-orphans
          rm -rf "$RUNNER_TEMP/occ-edge-jwks" \
            "$RUNNER_TEMP/occ-edge-test.key" "$RUNNER_TEMP/occ-edge-test.crt"
