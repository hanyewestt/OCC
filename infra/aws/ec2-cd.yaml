AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  OCC CD host: one t3.small EC2 instance with durable encrypted data storage,
  S3 release storage, ECR repositories, Secrets Manager deployment secrets and
  a CloudFront distribution with the AWS-provided certificate serving browser
  HTTPS over a restricted HTTP origin. Reviewed bootstrap: every deployment
  starts from an explicit change set, never an automatic stack mutation.

Parameters:
  RepositoryName:
    Type: String
    Default: pslimmm/OCC
    Description: GitHub repository allowed to assume the CI/CD roles.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small]
    Description: Always-on instance size; changing it is a reviewed decision.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Current Amazon Linux 2023 AMI resolved at creation time.
  DataVolumeSize:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 20
    Description: Durable PostgreSQL data volume (GiB).
  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 20
    Description: Root volume (GiB).
  ExistingDataVolumeId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^vol-[0-9a-f]{8,17}$'
    Description: Optional verified retained volume to adopt without formatting.
  DataVolumeAvailabilityZone:
    Type: String
    Default: ""
    Description: Required availability zone when adopting an existing volume.
  OriginSecretName:
    Type: String
    Default: occ-ec2-cd/origin-secret
    Description: Secrets Manager name holding the CloudFront origin header value.
  DeploymentSecretName:
    Type: String
    Default: occ-ec2-cd/deployment
    Description: Secrets Manager name holding the imported deployment settings.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: Dedicated VPC range for the deployment host.
  CloudFrontOriginPrefixListId:
    Type: String
    Description: >-
      ID of the AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing
      in this region; the bootstrap tool resolves it before applying the change set.
  EgressAllowedPrefixListId:
    Type: String
    MinLength: 9
    Description: >-
      ID of the customer-managed prefix list holding the only outbound IPv4
      destinations the host may reach on port 443. Populate it with the AWS
      service ranges plus the Supabase, DataMall, Gemini, image-registry and
      package-source ranges the deployment uses; an unrestricted entry must
      never be added. The bootstrap tool resolves the occ-ec2-cd-egress list.
  OidcProviderArn:
    Type: String
    Description: >-
      ARN of the existing GitHub Actions OIDC provider to reuse; the bootstrap
      tool resolves it and never creates a second provider.

Conditions:
  HasExistingDataVolume: !Not [!Equals [!Ref ExistingDataVolumeId, ""]]
  CreateDataVolume: !Equals [!Ref ExistingDataVolumeId, ""]

Resources:
  OccVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: occ-ec2-cd

  OccPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref OccVpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !If [HasExistingDataVolume, !Ref DataVolumeAvailabilityZone, !Select [0, !GetAZs ""]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: occ-ec2-cd-public

  OccInternetGateway:
    Type: AWS::EC2::InternetGateway

  OccVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref OccVpc
      InternetGatewayId: !Ref OccInternetGateway

  OccPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OccVpc

  OccPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: OccVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref OccPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref OccInternetGateway

  OccSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OccPublicSubnet
      RouteTableId: !Ref OccPublicRouteTable

  # The only inbound path is the CloudFront origin-facing managed prefix list
  # to the plain HTTP edge port. No SSH, no database, no direct service ports.
  OccOriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic to the OCC HTTP edge only
      VpcId: !Ref OccVpc
      SecurityGroupIngress:
        - Description: CloudFront origin fetches to the Nginx HTTP edge
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        # Outbound destinations are an explicit allow-list: AWS service
        # endpoints plus the deployment's Supabase, DataMall, Gemini, image
        # registry and package sources. The stack fails closed when the list is
        # missing; no unrestricted entry is permitted.
        - Description: HTTPS to the explicit egress allow-list
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref EgressAllowedPrefixListId
        # The VPC resolver is only reachable inside the VPC range, so DNS never
        # widens the allow-list.
        - Description: VPC DNS resolver
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
        - Description: VPC DNS resolver over TCP
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: occ-ec2-cd-origin

  OccElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  OccElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt OccElasticIp.AllocationId
      InstanceId: !Ref OccHost

  OccHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub occ-ec2-cd-host-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: occ-release-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeVolumes]
                Resource: "*"
              - Effect: Allow
                Action: [ec2:CreateTags]
                Resource: !Sub
                  - "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${VolumeId}"
                  - VolumeId: !If [HasExistingDataVolume, !Ref ExistingDataVolumeId, !Ref OccDataVolume]
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: ["occ:filesystem-uuid"]
                  "Null":
                    aws:TagKeys: "false"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  - !GetAtt OccIngestionRepository.Arn
                  - !GetAtt OccDisruptionRepository.Arn
                  - !GetAtt OccPlanningRepository.Arn
                  - !GetAtt OccDbSetupRepository.Arn
                  - !GetAtt OccWebRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !GetAtt OccReleaseBucket.Arn
                  - !Sub "${OccReleaseBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${OccReleaseBucket.Arn}/state/receipts/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${OccReleaseBucket.Arn}/backups/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DeploymentSecretName}*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${OriginSecretName}*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt OccReleaseKey.Arn

  OccInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref OccHostRole]

  OccHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref OccInstanceProfile
      SubnetId: !Ref OccPublicSubnet
      SecurityGroupIds: [!Ref OccOriginSecurityGroup]
      # No SSH key pair: the host is reached through SSM only.
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        # Instance credentials require IMDSv2; no fallback to token-less IMDS.
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: occ-ec2-cd-host

  OccDataVolume:
    Type: AWS::EC2::Volume
    Condition: CreateDataVolume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt OccPublicSubnet.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: occ-ec2-cd-data

  OccDataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref OccHost
      VolumeId: !If [HasExistingDataVolume, !Ref ExistingDataVolumeId, !Ref OccDataVolume]

  OccReleaseKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Server-side encryption key for the OCC release bucket
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account keeps administrative control so the release roles can
          # be delegated key use through their IAM policies.
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # S3 may use the key only for this account's bucket traffic.
          - Sid: AllowS3Use
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "kms:ViaService": !Sub "s3.${AWS::Region}.amazonaws.com"

  OccReleaseKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/occ-ec2-cd-releases
      TargetKeyId: !Ref OccReleaseKey

  OccReleaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub occ-ec2-cd-releases-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRetiredBackupVersions
            Status: Enabled
            Prefix: backups/
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt OccReleaseKey.Arn
            # Bucket keys cut KMS request costs without weakening encryption.
            BucketKeyEnabled: true
      Tags:
        - Key: Name
          Value: occ-ec2-cd-releases

  OccReleaseBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OccReleaseBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt OccReleaseBucket.Arn
              - !Sub "${OccReleaseBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  OccIngestionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: occ/ingestion
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS

  OccDisruptionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: occ/disruption
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS

  OccPlanningRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: occ/planning
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS

  OccDbSetupRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: occ/db-setup
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS

  OccWebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: occ/web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS

  OccDeploymentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref DeploymentSecretName
      Description: Imported deployment settings; values are written by the bootstrap tool.
      # The bootstrap tool writes the real value; the template only reserves
      # the name so the stack owns its lifecycle.
  OccOriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref OriginSecretName
      Description: Value checked by the Nginx edge against the X-OCC-Origin-Secret header.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        RequireEachIncludedType: false

  OccVerifyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub occ-ec2-cd-verify-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${RepositoryName}:ref:refs/heads/main"
      Policies:
        - PolicyName: occ-verify-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability, ecr:DescribeImages]
                Resource:
                  - !GetAtt OccIngestionRepository.Arn
                  - !GetAtt OccDisruptionRepository.Arn
                  - !GetAtt OccPlanningRepository.Arn
                  - !GetAtt OccDbSetupRepository.Arn
                  - !GetAtt OccWebRepository.Arn
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt OccReleaseBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub "${OccReleaseBucket.Arn}/state/latest-published.json"
                  - !Sub "${OccReleaseBucket.Arn}/releases/*"
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !GetAtt OccReleaseKey.Arn

  OccPublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub occ-ec2-cd-publish-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              ForAnyValue:StringEquals:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${RepositoryName}:ref:refs/heads/main"
                  - !Sub "repo:${RepositoryName}:environment:production"
      Policies:
        - PolicyName: occ-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource:
                  - !GetAtt OccIngestionRepository.Arn
                  - !GetAtt OccDisruptionRepository.Arn
                  - !GetAtt OccPlanningRepository.Arn
                  - !GetAtt OccDbSetupRepository.Arn
                  - !GetAtt OccWebRepository.Arn
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt OccReleaseBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "${OccReleaseBucket.Arn}/releases/*"
                  - !Sub "${OccReleaseBucket.Arn}/state/latest-published.json"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "${OccReleaseBucket.Arn}/releases/*"
                  - !Sub "${OccReleaseBucket.Arn}/state/latest-published.json"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt OccReleaseKey.Arn

  OccDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub occ-ec2-cd-deploy-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              ForAnyValue:StringEquals:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${RepositoryName}:ref:refs/heads/main"
                  - !Sub "repo:${RepositoryName}:environment:production"
      Policies:
        - PolicyName: occ-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !GetAtt OccReleaseBucket.Arn
                  - !Sub "${OccReleaseBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${OccReleaseBucket.Arn}/state/*"
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource: !Sub "${OccReleaseBucket.Arn}/state/operations/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt OccReleaseKey.Arn
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${OccHost.InstanceId}"
              - Effect: Allow
                Action:
                  - ssm:ListCommands
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${OccHost.InstanceId}"
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                Resource: "*"

  # CloudFront-scoped WAF resources must live in us-east-1, which is the only
  # region the bootstrap tooling targets.
  OccEdgeWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: occ-ec2-cd-edge
      Description: Managed protections for the OCC browser edge
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSCommonRules
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: occ-edge-common-rules
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: occ-edge-waf

  OccCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - OccElasticIpAssociation
      - OccOriginSecret
    Properties:
      DistributionConfig:
        Comment: OCC browser HTTPS via the AWS-provided certificate
        Enabled: true
        WebACLId: !GetAtt OccEdgeWebAcl.Arn
        HttpVersion: http2
        IPV6Enabled: false
        PriceClass: PriceClass_100
        # Browser TLS with the AWS-provided *.cloudfront.net certificate; no
        # custom domain, no ACM certificate, no alternate host names.
        Aliases: []
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: OccOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]
          # No caching at all initially: never serve stale private responses
          # or stale content while the origin is paused.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewer: forwards the viewer's headers including Authorization,
          # cookies and query strings to the origin.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: false
        Origins:
          - Id: OccOrigin
            # CloudFront origins must be DNS names; the instance public DNS
            # name tracks the associated Elastic IP after its association.
            DomainName: !GetAtt OccHost.PublicDnsName
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 8080
              OriginProtocolPolicy: http-only
              OriginKeepaliveTimeout: 5
              # Long enough above the measured pacing heartbeat gap; the live
              # SSE rollout check remains a deployment-time verification.
              OriginReadTimeout: 120
            OriginCustomHeaders:
              - HeaderName: X-OCC-Origin-Secret
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecretName}}}"
        # Never cache error responses: a paused or restarting origin must not
        # serve stale private content.
        CustomErrorResponses:
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0

Outputs:
  DataVolumeId:
    Value: !If [HasExistingDataVolume, !Ref ExistingDataVolumeId, !Ref OccDataVolume]
  DataVolumeAvailabilityZone:
    Value: !GetAtt OccPublicSubnet.AvailabilityZone
  InstanceId:
    Value: !Ref OccHost
  PublicIp:
    Value: !Ref OccElasticIp
  CloudFrontUrl:
    Value: !Sub "https://${OccCloudFrontDistribution.DomainName}"
  CloudFrontDistributionId:
    Value: !Ref OccCloudFrontDistribution
  ReleaseBucketName:
    Value: !Ref OccReleaseBucket
  DeploymentSecretName:
    Value: !Ref DeploymentSecretName
  OriginSecretName:
    Value: !Ref OriginSecretName
  PublishRoleArn:
    Value: !GetAtt OccPublishRole.Arn
  VerifyRoleArn:
    Value: !GetAtt OccVerifyRole.Arn
  DeployRoleArn:
    Value: !GetAtt OccDeployRole.Arn
  HostRoleName:
    Value: !Ref OccHostRole
  IngestionRepositoryUri:
    Value: !GetAtt OccIngestionRepository.RepositoryUri
  DisruptionRepositoryUri:
    Value: !GetAtt OccDisruptionRepository.RepositoryUri
  PlanningRepositoryUri:
    Value: !GetAtt OccPlanningRepository.RepositoryUri
  DbSetupRepositoryUri:
    Value: !GetAtt OccDbSetupRepository.RepositoryUri
  WebRepositoryUri:
    Value: !GetAtt OccWebRepository.RepositoryUri
