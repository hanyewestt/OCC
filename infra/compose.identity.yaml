# Mount the backend key from a Docker secret after completing the external
# Supabase role-hook rollout. The host source file is mounted into Ingestion only.
services:
  ingestion:
    environment:
      OCC_IDENTITY_ENABLED: ${OCC_IDENTITY_ENABLED:-true}
      OCC_IDENTITY_SECRET_KEY_FILE: /run/secrets/occ_supabase_identity_key
    secrets:
      - occ_supabase_identity_key

secrets:
  occ_supabase_identity_key:
    file: ${OCC_IDENTITY_SECRET_SOURCE_FILE:?set OCC_IDENTITY_SECRET_SOURCE_FILE to the mounted secret source file}
