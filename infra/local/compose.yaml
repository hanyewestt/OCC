# infra/local/compose.yaml
#
# Week 1 local environment — database only for now. Plan 1 adds Caddy,
# Operations, Ingestion and Planning services to this file on Day 1/Day 4.
#
# Usage (from repo root):
#   cp infra/local/.env.example infra/local/.env      # then edit passwords
#   docker compose -f infra/local/compose.yaml up -d
#
# Everything in postgres/init runs ONCE, on the first start of an empty
# volume. It creates the three schemas and three application users.
# It does NOT create tables — each service owns its tables via Flyway
# (services/<name>/src/main/resources/db/migration).

services:
  postgres:
    # Matches project-v2.md "PostgreSQL 18.6 with PostGIS" on RDS.
    # PostGIS 3.6 is the current supported pairing for PG18.
    image: postgis/postgis:18-3.6
    container_name: occ-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Superuser used ONLY by the init scripts and by developers for psql.
      # Services never connect as this user.
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/local/.env}
      # Per-schema application users, consumed by postgres/init/01_schemas_and_roles.sh
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set in infra/local/.env}
      OCC_OPERATIONS_DB_PASSWORD: ${OCC_OPERATIONS_DB_PASSWORD:?set in infra/local/.env}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set in infra/local/.env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images moved the data VOLUME from /var/lib/postgresql/data
      # to /var/lib/postgresql. Mounting the old path would leave data unpersisted.
      - occ_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-occ_admin} -d ${POSTGRES_DB:-occ}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  occ_pgdata:
