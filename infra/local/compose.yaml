# infra/local/compose.yaml
#
# Complete local OCC stack and optional pgAdmin dashboard (--profile tools).
#
# Usage (from repo root):
#   cp .env.example .env      # then edit passwords
#   docker compose --env-file .env -f infra/local/compose.yaml up -d
#
# Application containers communicate over the Compose network by service name.
# Only published ports are reachable through the host.

services:
  postgres:
    # Matches project-v2.md "PostgreSQL 18.6 with PostGIS" on RDS.
    # PostGIS 3.6 is the current supported pairing for PG18.
    image: postgis/postgis:18-3.6
    container_name: occ-postgres
    restart: unless-stopped
    environment:
      # Superuser used ONLY by the init scripts and by developers for psql.
      # Services never connect as this user.
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      # Per-schema application users, consumed by the postgres init scripts.
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set in root .env}
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
      OCC_RECOMMENDATION_DB_PASSWORD: ${OCC_RECOMMENDATION_DB_PASSWORD:?set in root .env}
      OCC_DIAGNOSIS_DB_PASSWORD: ${OCC_DIAGNOSIS_DB_PASSWORD:?set in root .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images moved the data VOLUME from /var/lib/postgresql/data
      # to /var/lib/postgresql. Mounting the old path would leave data unpersisted.
      - occ_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-occ_admin} -d ${POSTGRES_DB:-occ}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bunching-schema-init:
    image: postgis/postgis:18-3.6
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      PGHOST: postgres
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["bash", "/docker-entrypoint-initdb.d/02_bunching_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-schema-init:
    image: postgis/postgis:18-3.6
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      PGHOST: postgres
      OCC_RECOMMENDATION_DB_PASSWORD: ${OCC_RECOMMENDATION_DB_PASSWORD:?set in root .env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["bash", "/docker-entrypoint-initdb.d/04_recommendation_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  diagnosis-schema-init:
    image: postgis/postgis:18-3.6
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      PGHOST: postgres
      OCC_DIAGNOSIS_DB_PASSWORD: ${OCC_DIAGNOSIS_DB_PASSWORD:?set in root .env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["bash", "/docker-entrypoint-initdb.d/05_root_cause_diagnosis_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    image: occ-ingestion:local
    build:
      context: ../../services/ingestion
    restart: unless-stopped
    environment:
      OCC_INGESTION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set in root .env}
      OCC_INGESTION_INTERNAL_PORT: ${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_INGESTION_MONITORED_SERVICES: ${OCC_INGESTION_MONITORED_SERVICES:-190,972}
      OCC_INGESTION_STALE_AFTER_SECONDS: ${OCC_INGESTION_STALE_AFTER_SECONDS:-180}
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL: ${OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL:-60s}
      OCC_INGESTION_BUS_ARRIVAL_INITIAL_DELAY: ${OCC_INGESTION_BUS_ARRIVAL_INITIAL_DELAY:-60s}
      OCC_INGESTION_RETENTION_INTERVAL: ${OCC_INGESTION_RETENTION_INTERVAL:-1h}
      OCC_INGESTION_RETENTION_INITIAL_DELAY: ${OCC_INGESTION_RETENTION_INITIAL_DELAY:-5m}
      OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP: ${OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP:-true}
      OCC_INGESTION_SEED_TARGETS_ON_STARTUP: ${OCC_INGESTION_SEED_TARGETS_ON_STARTUP:-true}
      OCC_INGESTION_FLYWAY_ENABLED: ${OCC_INGESTION_FLYWAY_ENABLED:-true}
      OCC_INGESTION_JPA_DDL_AUTO: ${OCC_INGESTION_JPA_DDL_AUTO:-validate}
      OCC_INGESTION_DEMO_SCENARIO: ${OCC_INGESTION_DEMO_SCENARIO:-route190-bunching-v1}
      OCC_INGESTION_DEMO_SEED: ${OCC_INGESTION_DEMO_SEED:-190}
      OCC_INGESTION_DEMO_STEP_INTERVAL: ${OCC_INGESTION_DEMO_STEP_INTERVAL:-5s}
      OCC_BUNCHING_THRESHOLD: ${OCC_BUNCHING_THRESHOLD:-90s}
      OCC_BUNCHING_INTERNAL_URL: http://bus-bunching-detection:${OCC_BUNCHING_INTERNAL_PORT:-8002}
      OCC_BUNCHING_CONTROL_TIMEOUT: ${OCC_BUNCHING_CONTROL_TIMEOUT:-5s}
      OCC_RECOMMENDATION_INTERNAL_URL: http://recommendation-engine:${OCC_RECOMMENDATION_INTERNAL_PORT:-8003}
      OCC_INGESTION_RECOMMENDATION_TIMEOUT: ${OCC_INGESTION_RECOMMENDATION_TIMEOUT:-5s}
      OCC_DATAMALL_BASE_URL: ${OCC_DATAMALL_BASE_URL:-https://datamall2.mytransport.sg/ltaodataservice}
      OCC_DATAMALL_CONNECT_TIMEOUT: ${OCC_DATAMALL_CONNECT_TIMEOUT:-5s}
      OCC_DATAMALL_RESPONSE_TIMEOUT: ${OCC_DATAMALL_RESPONSE_TIMEOUT:-20s}
      DATAMALL_API_KEY: ${DATAMALL_API_KEY:?set in root .env}
    ports:
      - "${OCC_INGESTION_PORT:-6767}:${OCC_INGESTION_INTERNAL_PORT:-8001}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_INGESTION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  bus-bunching-detection:
    image: occ-bus-bunching-detection:local
    build:
      context: ../../services/operations/bus-bunching-detection
    restart: unless-stopped
    environment:
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_BUNCHING_RETENTION_INTERVAL: ${OCC_BUNCHING_RETENTION_INTERVAL:-1h}
      OCC_BUNCHING_RETENTION_INITIAL_DELAY: ${OCC_BUNCHING_RETENTION_INITIAL_DELAY:-5m}
      OCC_BUNCHING_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_BUNCHING_DB_USER: ${OCC_BUNCHING_DB_USER:-occ_bunching}
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
      OCC_BUNCHING_STALE_AFTER: ${OCC_BUNCHING_STALE_AFTER:-180s}
      OCC_BUNCHING_POLL_INTERVAL: ${OCC_BUNCHING_POLL_INTERVAL:-1s}
      OCC_BUNCHING_BATCH_SIZE: ${OCC_BUNCHING_BATCH_SIZE:-100}
      OCC_BUNCHING_THRESHOLD: ${OCC_BUNCHING_THRESHOLD:-90s}
      OCC_BUNCHING_RETRY_DELAY: ${OCC_BUNCHING_RETRY_DELAY:-30s}
      OCC_BUNCHING_CONSUMER_ENABLED: ${OCC_BUNCHING_CONSUMER_ENABLED:-true}
      OCC_BUNCHING_INTERNAL_PORT: ${OCC_BUNCHING_INTERNAL_PORT:-8002}
      OCC_BUNCHING_INGESTION_CONNECT_TIMEOUT: ${OCC_BUNCHING_INGESTION_CONNECT_TIMEOUT:-2s}
      OCC_BUNCHING_INGESTION_RESPONSE_TIMEOUT: ${OCC_BUNCHING_INGESTION_RESPONSE_TIMEOUT:-5s}
      OCC_BUNCHING_EXPECTED_HEADWAY: ${OCC_BUNCHING_EXPECTED_HEADWAY:-600s}
      OCC_BUNCHING_DIAGNOSIS_INTERNAL_URL: http://root-cause-diagnosis:${OCC_DIAGNOSIS_INTERNAL_PORT:-8004}
      OCC_BUNCHING_DIAGNOSIS_WORKER_ENABLED: ${OCC_BUNCHING_DIAGNOSIS_WORKER_ENABLED:-true}
      OCC_BUNCHING_DIAGNOSIS_DELIVERY_INTERVAL: ${OCC_BUNCHING_DIAGNOSIS_DELIVERY_INTERVAL:-2s}
      OCC_BUNCHING_DIAGNOSIS_REQUEST_TIMEOUT: ${OCC_BUNCHING_DIAGNOSIS_REQUEST_TIMEOUT:-5s}
      OCC_BUNCHING_DIAGNOSIS_LEASE_DURATION: ${OCC_BUNCHING_DIAGNOSIS_LEASE_DURATION:-1m}
      OCC_BUNCHING_DIAGNOSIS_BATCH_SIZE: ${OCC_BUNCHING_DIAGNOSIS_BATCH_SIZE:-10}
      OCC_BUNCHING_DIAGNOSIS_MAX_ATTEMPTS: ${OCC_BUNCHING_DIAGNOSIS_MAX_ATTEMPTS:-0}
      OCC_BUNCHING_DIAGNOSIS_RETRY_INITIAL_DELAY: ${OCC_BUNCHING_DIAGNOSIS_RETRY_INITIAL_DELAY:-2s}
      OCC_BUNCHING_DIAGNOSIS_RETRY_MAX_DELAY: ${OCC_BUNCHING_DIAGNOSIS_RETRY_MAX_DELAY:-1m}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
    ports:
      - "${OCC_BUNCHING_PORT:-6768}:${OCC_BUNCHING_INTERNAL_PORT:-8002}"
    depends_on:
      bunching-schema-init:
        condition: service_completed_successfully
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_BUNCHING_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  recommendation-engine:
    image: occ-recommendation-engine:local
    build:
      context: ../../services/planning/recommendation-engine
    restart: unless-stopped
    environment:
      OCC_RECOMMENDATION_AUDIT_MAX_RESPONSE_CHARACTERS: ${OCC_RECOMMENDATION_AUDIT_MAX_RESPONSE_CHARACTERS:-65536}
      OCC_RECOMMENDATION_INTERNAL_PORT: ${OCC_RECOMMENDATION_INTERNAL_PORT:-8003}
      OCC_RECOMMENDATION_FIXTURE_LOCATION: ${OCC_RECOMMENDATION_FIXTURE_LOCATION:-classpath:fixtures/bunching-mitigation-context.json}
      OCC_RECOMMENDATION_AI_ENABLED: ${OCC_RECOMMENDATION_AI_ENABLED:-false}
      OCC_RECOMMENDATION_GEMINI_API_KEY: ${OCC_RECOMMENDATION_GEMINI_API_KEY:-}
      OCC_RECOMMENDATION_GEMINI_MODEL: ${OCC_RECOMMENDATION_GEMINI_MODEL:-gemini-3.1-flash-lite}
      OCC_RECOMMENDATION_GEMINI_TEMPERATURE: ${OCC_RECOMMENDATION_GEMINI_TEMPERATURE:-1.0}
      OCC_RECOMMENDATION_GEMINI_MAX_OUTPUT_TOKENS: ${OCC_RECOMMENDATION_GEMINI_MAX_OUTPUT_TOKENS:-512}
      OCC_RECOMMENDATION_GEMINI_THINKING_LEVEL: ${OCC_RECOMMENDATION_GEMINI_THINKING_LEVEL:-MINIMAL}
      OCC_RECOMMENDATION_GEMINI_REQUEST_TIMEOUT: ${OCC_RECOMMENDATION_GEMINI_REQUEST_TIMEOUT:-30s}
      OCC_RECOMMENDATION_GEMINI_RETRY_ATTEMPTS: ${OCC_RECOMMENDATION_GEMINI_RETRY_ATTEMPTS:-2}
      OCC_RECOMMENDATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_RECOMMENDATION_DB_USERNAME: ${OCC_RECOMMENDATION_DB_USERNAME:-occ_recommendation}
      OCC_RECOMMENDATION_DB_PASSWORD: ${OCC_RECOMMENDATION_DB_PASSWORD:?set in root .env}
      OCC_RECOMMENDATION_MAX_REQUEST_BODY_BYTES: ${OCC_RECOMMENDATION_MAX_REQUEST_BODY_BYTES:-65536}
      OCC_RECOMMENDATION_MAX_PROMPT_INPUT_BYTES: ${OCC_RECOMMENDATION_MAX_PROMPT_INPUT_BYTES:-65536}
    ports:
      - "${OCC_RECOMMENDATION_PORT:-6769}:${OCC_RECOMMENDATION_INTERNAL_PORT:-8003}"
    depends_on:
      recommendation-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_RECOMMENDATION_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  root-cause-diagnosis:
    image: occ-root-cause-diagnosis:local
    build:
      context: ../../services/planning/root-cause-diagnosis
    restart: unless-stopped
    environment:
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-12h}
      OCC_DIAGNOSIS_RETENTION_INTERVAL: ${OCC_DIAGNOSIS_RETENTION_INTERVAL:-1h}
      OCC_DIAGNOSIS_RETENTION_INITIAL_DELAY: ${OCC_DIAGNOSIS_RETENTION_INITIAL_DELAY:-5m}
      OCC_DIAGNOSIS_AUDIT_MAX_RESPONSE_CHARACTERS: ${OCC_DIAGNOSIS_AUDIT_MAX_RESPONSE_CHARACTERS:-65536}
      OCC_DIAGNOSIS_INTERNAL_PORT: ${OCC_DIAGNOSIS_INTERNAL_PORT:-8004}
      OCC_DIAGNOSIS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_DIAGNOSIS_DB_USERNAME: ${OCC_DIAGNOSIS_DB_USERNAME:-occ_diagnosis}
      OCC_DIAGNOSIS_DB_PASSWORD: ${OCC_DIAGNOSIS_DB_PASSWORD:?set in root .env}
      OCC_DIAGNOSIS_BUNCHING_INTERNAL_URL: http://bus-bunching-detection:${OCC_BUNCHING_INTERNAL_PORT:-8002}
      OCC_DIAGNOSIS_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_DIAGNOSIS_RECOMMENDATION_INTERNAL_URL: http://recommendation-engine:${OCC_RECOMMENDATION_INTERNAL_PORT:-8003}
      OCC_DIAGNOSIS_WORKER_ENABLED: ${OCC_DIAGNOSIS_WORKER_ENABLED:-true}
      OCC_DIAGNOSIS_WORKER_INTERVAL: ${OCC_DIAGNOSIS_WORKER_INTERVAL:-2s}
      OCC_DIAGNOSIS_WORKER_BATCH_SIZE: ${OCC_DIAGNOSIS_WORKER_BATCH_SIZE:-10}
      OCC_DIAGNOSIS_LEASE_DURATION: ${OCC_DIAGNOSIS_LEASE_DURATION:-5m}
      OCC_DIAGNOSIS_MAX_ATTEMPTS: ${OCC_DIAGNOSIS_MAX_ATTEMPTS:-3}
      OCC_DIAGNOSIS_DELIVERY_MAX_ATTEMPTS: ${OCC_DIAGNOSIS_DELIVERY_MAX_ATTEMPTS:-0}
      OCC_DIAGNOSIS_RETRY_INITIAL_DELAY: ${OCC_DIAGNOSIS_RETRY_INITIAL_DELAY:-2s}
      OCC_DIAGNOSIS_RETRY_MAX_DELAY: ${OCC_DIAGNOSIS_RETRY_MAX_DELAY:-1m}
      OCC_DIAGNOSIS_SCHEMA_REPAIR_ATTEMPTS: ${OCC_DIAGNOSIS_SCHEMA_REPAIR_ATTEMPTS:-1}
      OCC_DIAGNOSIS_EVIDENCE_LOOKBACK: ${OCC_DIAGNOSIS_EVIDENCE_LOOKBACK:-15m}
      OCC_DIAGNOSIS_EVIDENCE_RADIUS_KM: ${OCC_DIAGNOSIS_EVIDENCE_RADIUS_KM:-2.0}
      OCC_DIAGNOSIS_CONFIDENCE_THRESHOLD: ${OCC_DIAGNOSIS_CONFIDENCE_THRESHOLD:-0.70}
      OCC_DIAGNOSIS_REQUEST_TIMEOUT: ${OCC_DIAGNOSIS_REQUEST_TIMEOUT:-10s}
      OCC_DIAGNOSIS_PEER_RESPONSE_MAX_BYTES: ${OCC_DIAGNOSIS_PEER_RESPONSE_MAX_BYTES:-131072}
      OCC_DIAGNOSIS_MAX_PROMPT_INPUT_BYTES: ${OCC_DIAGNOSIS_MAX_PROMPT_INPUT_BYTES:-65536}
      OCC_DIAGNOSIS_GEMINI_API_KEY: ${OCC_DIAGNOSIS_GEMINI_API_KEY:-}
      OCC_DIAGNOSIS_GEMINI_MODEL: ${OCC_DIAGNOSIS_GEMINI_MODEL:-gemini-3.1-flash-lite}
      OCC_DIAGNOSIS_GEMINI_TEMPERATURE: ${OCC_DIAGNOSIS_GEMINI_TEMPERATURE:-1.0}
      OCC_DIAGNOSIS_GEMINI_THINKING_LEVEL: ${OCC_DIAGNOSIS_GEMINI_THINKING_LEVEL:-MINIMAL}
      OCC_DIAGNOSIS_GEMINI_MAX_OUTPUT_TOKENS: ${OCC_DIAGNOSIS_GEMINI_MAX_OUTPUT_TOKENS:-1024}
      OCC_DIAGNOSIS_GEMINI_REQUEST_TIMEOUT: ${OCC_DIAGNOSIS_GEMINI_REQUEST_TIMEOUT:-30s}
      OCC_DIAGNOSIS_GEMINI_RETRY_ATTEMPTS: ${OCC_DIAGNOSIS_GEMINI_RETRY_ATTEMPTS:-2}
      OCC_DIAGNOSIS_SWAGGER_ENABLED: ${OCC_DIAGNOSIS_SWAGGER_ENABLED:-true}
    ports:
      - "${OCC_DIAGNOSIS_PORT:-6770}:${OCC_DIAGNOSIS_INTERNAL_PORT:-8004}"
    depends_on:
      diagnosis-schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${OCC_DIAGNOSIS_INTERNAL_PORT}/actuator/health/readiness >/dev/null"]
      interval: ${OCC_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${OCC_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${OCC_HEALTHCHECK_RETRIES:-12}
      start_period: ${OCC_HEALTHCHECK_START_PERIOD:-30s}

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: occ-pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in root .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "${PGADMIN_PORT:-6700}:80"
    volumes:
      - occ_pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  occ_pgdata:
  occ_pgadmin:
