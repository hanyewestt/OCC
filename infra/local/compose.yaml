# infra/local/compose.yaml
#
# Complete local OCC stack and optional pgAdmin dashboard (--profile tools).
#
# Usage (from repo root):
#   cp .env.example .env      # then edit passwords
#   docker compose --env-file .env -f infra/local/compose.yaml up -d
#
# Application containers communicate over the Compose network by service name.
# Only published ports are reachable through the host.

services:
  postgres:
    # Matches project-v2.md "PostgreSQL 18.6 with PostGIS" on RDS.
    # PostGIS 3.6 is the current supported pairing for PG18.
    image: postgis/postgis:18-3.6
    container_name: occ-postgres
    restart: unless-stopped
    environment:
      # Superuser used ONLY by the init scripts and by developers for psql.
      # Services never connect as this user.
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      # Per-schema application users, consumed by postgres/init/01_schemas_and_roles.sh
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set in root .env}
      OCC_OPERATIONS_DB_PASSWORD: ${OCC_OPERATIONS_DB_PASSWORD:?set in root .env}
      OCC_PLANNING_DB_PASSWORD: ${OCC_PLANNING_DB_PASSWORD:?set in root .env}
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images moved the data VOLUME from /var/lib/postgresql/data
      # to /var/lib/postgresql. Mounting the old path would leave data unpersisted.
      - occ_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-occ_admin} -d ${POSTGRES_DB:-occ}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bunching-schema-init:
    image: postgis/postgis:18-3.6
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      PGHOST: postgres
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["bash", "/docker-entrypoint-initdb.d/02_bunching_schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    image: occ-ingestion:local
    build:
      context: ../../services/ingestion
    restart: unless-stopped
    environment:
      OCC_INGESTION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_INGESTION_DB_USERNAME: ${OCC_INGESTION_DB_USERNAME:-occ_ingestion}
      OCC_INGESTION_DB_PASSWORD: ${OCC_INGESTION_DB_PASSWORD:?set in root .env}
      OCC_INGESTION_INTERNAL_PORT: ${OCC_INGESTION_INTERNAL_PORT:-8001}
      OCC_INGESTION_MONITORED_SERVICES: ${OCC_INGESTION_MONITORED_SERVICES:-190,972}
      OCC_INGESTION_STALE_AFTER_SECONDS: ${OCC_INGESTION_STALE_AFTER_SECONDS:-180}
      OCC_INGESTION_RETENTION: ${OCC_INGESTION_RETENTION:-24h}
      OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP: ${OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP:-true}
      OCC_INGESTION_SEED_TARGETS_ON_STARTUP: ${OCC_INGESTION_SEED_TARGETS_ON_STARTUP:-true}
      OCC_INGESTION_FLYWAY_ENABLED: ${OCC_INGESTION_FLYWAY_ENABLED:-true}
      OCC_INGESTION_JPA_DDL_AUTO: ${OCC_INGESTION_JPA_DDL_AUTO:-validate}
      OCC_DATAMALL_BASE_URL: ${OCC_DATAMALL_BASE_URL:-https://datamall2.mytransport.sg/ltaodataservice}
      DATAMALL_API_KEY: ${DATAMALL_API_KEY:?set in root .env}
    ports:
      - "${OCC_INGESTION_PORT:-6767}:${OCC_INGESTION_INTERNAL_PORT:-8001}"
    depends_on:
      postgres:
        condition: service_healthy

  bunching-read-grants:
    image: postgis/postgis:18-3.6
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-occ}
      POSTGRES_USER: ${POSTGRES_USER:-occ_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in root .env}
      PGHOST: postgres
      OCC_COMPOSE_STARTUP_TIMEOUT_SECONDS: ${OCC_COMPOSE_STARTUP_TIMEOUT_SECONDS:-180}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/wait_and_grant_bunching_views.sh:/usr/local/bin/wait_and_grant_bunching_views.sh:ro
    command: ["bash", "/usr/local/bin/wait_and_grant_bunching_views.sh"]
    depends_on:
      bunching-schema-init:
        condition: service_completed_successfully
      ingestion:
        condition: service_started

  bus-bunching-detection:
    image: occ-bus-bunching-detection:local
    build:
      context: ../../services/bus-bunching-detection
    restart: unless-stopped
    environment:
      OCC_BUNCHING_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_BUNCHING_DB_USER: ${OCC_BUNCHING_DB_USER:-occ_bunching}
      OCC_BUNCHING_DB_PASSWORD: ${OCC_BUNCHING_DB_PASSWORD:?set in root .env}
      OCC_BUNCHING_STALE_AFTER: ${OCC_BUNCHING_STALE_AFTER:-180s}
      OCC_BUNCHING_POLL_INTERVAL: ${OCC_BUNCHING_POLL_INTERVAL:-1s}
      OCC_BUNCHING_BATCH_SIZE: ${OCC_BUNCHING_BATCH_SIZE:-100}
      OCC_BUNCHING_THRESHOLD: ${OCC_BUNCHING_THRESHOLD:-90s}
      OCC_BUNCHING_CONSUMER_ENABLED: ${OCC_BUNCHING_CONSUMER_ENABLED:-true}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
    depends_on:
      bunching-read-grants:
        condition: service_completed_successfully

  operations:
    profiles: [demo]
    image: occ-operations:local
    build:
      context: ../../services/operations
    restart: unless-stopped
    environment:
      OCC_OPERATIONS_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-occ}
      OCC_OPERATIONS_DB_USERNAME: ${OCC_OPERATIONS_DB_USERNAME:-occ_operations}
      OCC_OPERATIONS_DB_PASSWORD: ${OCC_OPERATIONS_DB_PASSWORD:?set in root .env}
      OCC_OPERATIONS_INTERNAL_PORT: ${OCC_OPERATIONS_INTERNAL_PORT:-8002}
      OCC_OPERATIONS_JPA_DDL_AUTO: ${OCC_OPERATIONS_JPA_DDL_AUTO:-validate}
      OCC_OPERATIONS_API_DOCS_ENABLED: ${OCC_OPERATIONS_API_DOCS_ENABLED:-false}
      OCC_OPERATIONS_SWAGGER_UI_ENABLED: ${OCC_OPERATIONS_SWAGGER_UI_ENABLED:-false}
      OCC_COGNITO_ISSUER_URI: ${OCC_COGNITO_ISSUER_URI:?set to your Cognito pool issuer}
      OCC_COGNITO_APP_CLIENT_ID: ${OCC_COGNITO_APP_CLIENT_ID:?set to your Cognito app client ID}
      OCC_DEMO_FLEET_DEFAULT_PAGE_SIZE: ${OCC_DEMO_FLEET_DEFAULT_PAGE_SIZE:-50}
      OCC_DEMO_FLEET_MAX_PAGE_SIZE: ${OCC_DEMO_FLEET_MAX_PAGE_SIZE:-200}
      OCC_MAP_TILE_URL: ${OCC_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      OCC_MAP_ATTRIBUTION_TEXT: ${OCC_MAP_ATTRIBUTION_TEXT:-© OpenStreetMap contributors}
      OCC_MAP_ATTRIBUTION_URL: ${OCC_MAP_ATTRIBUTION_URL:-https://www.openstreetmap.org/copyright}
      OCC_MAP_REFRESH_INTERVAL: ${OCC_MAP_REFRESH_INTERVAL:-60s}
      OCC_TRACK_INFERENCE_ENABLED: ${OCC_TRACK_INFERENCE_ENABLED:-true}
      OCC_TRACK_INFERENCE_INTERVAL: ${OCC_TRACK_INFERENCE_INTERVAL:-60s}
      OCC_TRACK_INFERENCE_INITIAL_DELAY: ${OCC_TRACK_INFERENCE_INITIAL_DELAY:-5s}
      OCC_TRACK_INFERENCE_STALE_AFTER: ${OCC_TRACK_INFERENCE_STALE_AFTER:-180s}
      OCC_TRACK_INFERENCE_EXPIRY: ${OCC_TRACK_INFERENCE_EXPIRY:-5m}
      OCC_TRACK_INFERENCE_RETENTION: ${OCC_TRACK_INFERENCE_RETENTION:-24h}
      OCC_TRACK_INFERENCE_CLUSTER_TIME_WINDOW: ${OCC_TRACK_INFERENCE_CLUSTER_TIME_WINDOW:-30s}
      OCC_TRACK_INFERENCE_CLUSTER_METERS: ${OCC_TRACK_INFERENCE_CLUSTER_METERS:-60}
      OCC_TRACK_INFERENCE_MAX_ROUTE_OFFSET_METERS: ${OCC_TRACK_INFERENCE_MAX_ROUTE_OFFSET_METERS:-400}
      OCC_TRACK_INFERENCE_MAX_SPEED_METERS_PER_SECOND: ${OCC_TRACK_INFERENCE_MAX_SPEED_METERS_PER_SECOND:-25}
      OCC_TRACK_INFERENCE_BACKWARD_TOLERANCE_METERS: ${OCC_TRACK_INFERENCE_BACKWARD_TOLERANCE_METERS:-80}
      OCC_TRACK_INFERENCE_AMBIGUITY_MARGIN_METERS: ${OCC_TRACK_INFERENCE_AMBIGUITY_MARGIN_METERS:-20}
      OCC_TRACK_INFERENCE_ETA_TOLERANCE: ${OCC_TRACK_INFERENCE_ETA_TOLERANCE:-90s}
      OCC_TRACK_INFERENCE_PAGE_SIZE: ${OCC_TRACK_INFERENCE_PAGE_SIZE:-200}
      OCC_TRACK_INFERENCE_MAX_PAGES: ${OCC_TRACK_INFERENCE_MAX_PAGES:-20}
      OCC_DEMO_ROUTE_MAX_STOP_DISTANCE_METERS: ${OCC_DEMO_ROUTE_MAX_STOP_DISTANCE_METERS:-250}
      OCC_OPERATIONS_INGESTION_TIMEOUT: ${OCC_OPERATIONS_INGESTION_TIMEOUT:-5s}
      OCC_INGESTION_INTERNAL_URL: http://ingestion:${OCC_INGESTION_INTERNAL_PORT:-8001}
    ports:
      - "${OCC_OPERATIONS_PORT:-6768}:${OCC_OPERATIONS_INTERNAL_PORT:-8002}"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: occ-pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set in root .env}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "${PGADMIN_PORT:-6700}:80"
    volumes:
      - occ_pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  occ_pgdata:
  occ_pgadmin:
