services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: occ-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: occ
      POSTGRES_USER: occ
      POSTGRES_PASSWORD: occ_dev_password   # dev only; move to .env before anything shared
      # Tell the postgis image to create the postgis extension in the occ DB
      # automatically. Our 01_schema.sql also runs CREATE EXTENSION IF NOT EXISTS
      # as a belt-and-braces measure.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # Persist data between `docker compose down` / `up`.
      - occ_pgdata:/var/lib/postgresql/data
      # Every *.sql / *.sh in this folder runs ONCE, in filename order, on the
      # very first start of an empty volume. Hence 01_schema.sql now, 02_seed_*.sql
      # later for TASK 1.3.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occ -d occ"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  occ_pgdata:
