spring:
  application:
    name: recommendation-engine

server:
  port: ${OCC_RECOMMENDATION_INTERNAL_PORT:8002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

occ:
  recommendation:
    fixture:
      location: ${OCC_RECOMMENDATION_FIXTURE_LOCATION:classpath:fixtures/bunching-mitigation-context.json}

springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    persist-authorization: false
