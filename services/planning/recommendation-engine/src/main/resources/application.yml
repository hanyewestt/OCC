spring:
  application:
    name: recommendation-engine
  datasource:
    url: ${OCC_RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:5432/occ}
    username: ${OCC_RECOMMENDATION_DB_USERNAME:occ_recommendation}
    password: ${OCC_RECOMMENDATION_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    default-schema: recommendation
    create-schemas: false
    locations: classpath:db/migration

server:
  port: ${OCC_RECOMMENDATION_INTERNAL_PORT:8003}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

occ:
  recommendation:
    ai:
      enabled: ${OCC_RECOMMENDATION_AI_ENABLED:false}
      gemini:
        api-key: ${OCC_RECOMMENDATION_GEMINI_API_KEY:}
        model: ${OCC_RECOMMENDATION_GEMINI_MODEL:gemini-3.1-flash-lite}
        temperature: ${OCC_RECOMMENDATION_GEMINI_TEMPERATURE:1.0}
        max-output-tokens: ${OCC_RECOMMENDATION_GEMINI_MAX_OUTPUT_TOKENS:512}
        thinking-level: ${OCC_RECOMMENDATION_GEMINI_THINKING_LEVEL:MINIMAL}
        request-timeout: ${OCC_RECOMMENDATION_GEMINI_REQUEST_TIMEOUT:30s}
        retry-attempts: ${OCC_RECOMMENDATION_GEMINI_RETRY_ATTEMPTS:2}
    fixture:
      location: ${OCC_RECOMMENDATION_FIXTURE_LOCATION:classpath:fixtures/bunching-mitigation-context.json}

springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    persist-authorization: false
