spring:
  application:
    name: root-cause-diagnosis
  datasource:
    url: ${OCC_DIAGNOSIS_DB_URL}
    username: ${OCC_DIAGNOSIS_DB_USERNAME}
    password: ${OCC_DIAGNOSIS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    default-schema: diagnosis
    create-schemas: false
    locations: classpath:db/migration
  ai:
    chat:
      client:
        tool-calling:
          enabled: false
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false

server:
  port: ${OCC_DIAGNOSIS_INTERNAL_PORT:8004}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

occ:
  diagnosis:
    bunching-internal-url: ${OCC_DIAGNOSIS_BUNCHING_INTERNAL_URL:http://bus-bunching-detection:8002}
    ingestion-internal-url: ${OCC_DIAGNOSIS_INGESTION_INTERNAL_URL:http://ingestion:8001}
    recommendation-internal-url: ${OCC_DIAGNOSIS_RECOMMENDATION_INTERNAL_URL:http://recommendation-engine:8003}
    worker-enabled: ${OCC_DIAGNOSIS_WORKER_ENABLED:true}
    worker-interval: ${OCC_DIAGNOSIS_WORKER_INTERVAL:2s}
    worker-batch-size: ${OCC_DIAGNOSIS_WORKER_BATCH_SIZE:10}
    lease-duration: ${OCC_DIAGNOSIS_LEASE_DURATION:5m}
    max-attempts: ${OCC_DIAGNOSIS_MAX_ATTEMPTS:3}
    delivery-max-attempts: ${OCC_DIAGNOSIS_DELIVERY_MAX_ATTEMPTS:0}
    retry-initial-delay: ${OCC_DIAGNOSIS_RETRY_INITIAL_DELAY:2s}
    retry-max-delay: ${OCC_DIAGNOSIS_RETRY_MAX_DELAY:1m}
    schema-repair-attempts: ${OCC_DIAGNOSIS_SCHEMA_REPAIR_ATTEMPTS:1}
    evidence-lookback: ${OCC_DIAGNOSIS_EVIDENCE_LOOKBACK:15m}
    evidence-radius-km: ${OCC_DIAGNOSIS_EVIDENCE_RADIUS_KM:2.0}
    confidence-threshold: ${OCC_DIAGNOSIS_CONFIDENCE_THRESHOLD:0.70}
    request-timeout: ${OCC_DIAGNOSIS_REQUEST_TIMEOUT:10s}
    gemini:
      api-key: ${OCC_DIAGNOSIS_GEMINI_API_KEY:}
      model: ${OCC_DIAGNOSIS_GEMINI_MODEL:gemini-3.1-flash-lite}
      temperature: ${OCC_DIAGNOSIS_GEMINI_TEMPERATURE:1.0}
      thinking-level: ${OCC_DIAGNOSIS_GEMINI_THINKING_LEVEL:MINIMAL}
      max-output-tokens: ${OCC_DIAGNOSIS_GEMINI_MAX_OUTPUT_TOKENS:1024}
      request-timeout: ${OCC_DIAGNOSIS_GEMINI_REQUEST_TIMEOUT:30s}
      retry-attempts: ${OCC_DIAGNOSIS_GEMINI_RETRY_ATTEMPTS:2}

springdoc:
  api-docs:
    version: OPENAPI_3_1
  swagger-ui:
    persist-authorization: false
    enabled: ${OCC_DIAGNOSIS_SWAGGER_ENABLED:true}
