spring:
  application:
    name: operations
  datasource:
    url: ${OCC_OPERATIONS_DB_URL}
    username: ${OCC_OPERATIONS_DB_USERNAME:occ_operations}
    password: ${OCC_OPERATIONS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${OCC_OPERATIONS_JPA_DDL_AUTO:validate}
  flyway:
    default-schema: operations
    create-schemas: false
    locations: classpath:db/migration
server:
  port: ${OCC_OPERATIONS_INTERNAL_PORT:8002}
springdoc:
  api-docs:
    version: OPENAPI_3_1
    enabled: ${OCC_OPERATIONS_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${OCC_OPERATIONS_SWAGGER_UI_ENABLED:false}
occ:
  track-inference:
    enabled: ${OCC_TRACK_INFERENCE_ENABLED:true}
    interval: ${OCC_TRACK_INFERENCE_INTERVAL:60s}
    initial-delay: ${OCC_TRACK_INFERENCE_INITIAL_DELAY:5s}
    stale-after: ${OCC_TRACK_INFERENCE_STALE_AFTER:180s}
    expiry: ${OCC_TRACK_INFERENCE_EXPIRY:5m}
    retention: ${OCC_TRACK_INFERENCE_RETENTION:24h}
    cluster-time-window: ${OCC_TRACK_INFERENCE_CLUSTER_TIME_WINDOW:30s}
    cluster-meters: ${OCC_TRACK_INFERENCE_CLUSTER_METERS:60}
    max-route-offset-meters: ${OCC_TRACK_INFERENCE_MAX_ROUTE_OFFSET_METERS:400}
    max-speed-meters-per-second: ${OCC_TRACK_INFERENCE_MAX_SPEED_METERS_PER_SECOND:25}
    backward-tolerance-meters: ${OCC_TRACK_INFERENCE_BACKWARD_TOLERANCE_METERS:80}
    ambiguity-margin-meters: ${OCC_TRACK_INFERENCE_AMBIGUITY_MARGIN_METERS:20}
    eta-tolerance: ${OCC_TRACK_INFERENCE_ETA_TOLERANCE:90s}
    page-size: ${OCC_TRACK_INFERENCE_PAGE_SIZE:200}
    max-pages: ${OCC_TRACK_INFERENCE_MAX_PAGES:20}
  map:
    tile-url: ${OCC_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    attribution-text: ${OCC_MAP_ATTRIBUTION_TEXT:© OpenStreetMap contributors}
    attribution-url: ${OCC_MAP_ATTRIBUTION_URL:https://www.openstreetmap.org/copyright}
    refresh-interval: ${OCC_MAP_REFRESH_INTERVAL:60s}
  cognito:
    issuer-uri: ${OCC_COGNITO_ISSUER_URI}
    app-client-id: ${OCC_COGNITO_APP_CLIENT_ID}
  demo-fleet:
    default-page-size: ${OCC_DEMO_FLEET_DEFAULT_PAGE_SIZE:50}
    max-page-size: ${OCC_DEMO_FLEET_MAX_PAGE_SIZE:200}
  demo-route:
    max-stop-distance-meters: ${OCC_DEMO_ROUTE_MAX_STOP_DISTANCE_METERS:250}
  ingestion-topology:
    base-url: ${OCC_INGESTION_INTERNAL_URL:${OCC_INGESTION_PUBLIC_URL}}
    timeout: ${OCC_OPERATIONS_INGESTION_TIMEOUT:5s}
