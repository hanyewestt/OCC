spring:
  application:
    name: bus-bunching-detection
  datasource:
    url: ${OCC_BUNCHING_DB_URL}
    username: ${OCC_BUNCHING_DB_USER:occ_bunching}
    password: ${OCC_BUNCHING_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    default-schema: bunching
    create-schemas: false
    locations: classpath:db/migration
server:
  port: ${OCC_BUNCHING_INTERNAL_PORT:8002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

occ:
  bunching:
    consumer-enabled: ${OCC_BUNCHING_CONSUMER_ENABLED:true}
    threshold: ${OCC_BUNCHING_THRESHOLD:90s}
    retry-delay: ${OCC_BUNCHING_RETRY_DELAY:30s}
    # Required deployment choice: align with ingestion's configured freshness policy.
    stale-after: ${OCC_BUNCHING_STALE_AFTER:120s}
    poll-interval: ${OCC_BUNCHING_POLL_INTERVAL:1s}
    batch-size: ${OCC_BUNCHING_BATCH_SIZE:100}
    ingestion-base-url: ${OCC_INGESTION_INTERNAL_URL:${OCC_INGESTION_PUBLIC_URL:http://localhost:${OCC_INGESTION_PORT:6767}}}
    expected-headway: ${OCC_BUNCHING_EXPECTED_HEADWAY:600s}
    ingestion-connect-timeout: ${OCC_BUNCHING_INGESTION_CONNECT_TIMEOUT:2s}
    ingestion-response-timeout: ${OCC_BUNCHING_INGESTION_RESPONSE_TIMEOUT:5s}
    diagnosis:
      internal-url: ${OCC_BUNCHING_DIAGNOSIS_INTERNAL_URL:http://root-cause-diagnosis:8004}
      worker-enabled: ${OCC_BUNCHING_DIAGNOSIS_WORKER_ENABLED:true}
      delivery-interval: ${OCC_BUNCHING_DIAGNOSIS_DELIVERY_INTERVAL:2s}
      request-timeout: ${OCC_BUNCHING_DIAGNOSIS_REQUEST_TIMEOUT:5s}
      lease-duration: ${OCC_BUNCHING_DIAGNOSIS_LEASE_DURATION:1m}
      batch-size: ${OCC_BUNCHING_DIAGNOSIS_BATCH_SIZE:10}
      max-attempts: ${OCC_BUNCHING_DIAGNOSIS_MAX_ATTEMPTS:0}
      retry-initial-delay: ${OCC_BUNCHING_DIAGNOSIS_RETRY_INITIAL_DELAY:2s}
      retry-max-delay: ${OCC_BUNCHING_DIAGNOSIS_RETRY_MAX_DELAY:1m}
