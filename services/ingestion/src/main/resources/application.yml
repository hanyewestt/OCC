spring:
  application:
    name: ingestion
  datasource:
    url: ${OCC_INGESTION_DB_INTERNAL_URL}
    username: ${OCC_INGESTION_DB_USERNAME:occ_ingestion}
    password: ${OCC_INGESTION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${OCC_INGESTION_JPA_DDL_AUTO:validate}
  flyway:
    enabled: false
    default-schema: ingestion
    create-schemas: false
    locations: classpath:db/migration
server:
  port: ${OCC_INGESTION_INTERNAL_PORT:8001}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    version: OPENAPI_3_1

occ:
  security:
    supabase:
      project-url: ${SUPABASE_PROJECT_URL}
      jwks-url: ${SUPABASE_JWKS_URL}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      clock-skew: ${SUPABASE_JWT_CLOCK_SKEW:30s}
      allowed-algorithms: ${SUPABASE_JWT_ALLOWED_ALGORITHMS:ES256}
    peer:
      disruption-to-ingestion-token: ${OCC_DISRUPTION_TO_INGESTION_PEER_TOKEN}
      planning-to-ingestion-token: ${OCC_PLANNING_TO_INGESTION_PEER_TOKEN}
    peer-clients:
      disruption-token: ${OCC_INGESTION_TO_DISRUPTION_PEER_TOKEN}
      planning-token: ${OCC_INGESTION_TO_PLANNING_PEER_TOKEN}
  datamall:
    base-url: ${OCC_DATAMALL_BASE_URL:https://datamall2.mytransport.sg/ltaodataservice}
    account-key: ${DATAMALL_API_KEY}
    connect-timeout: ${OCC_DATAMALL_CONNECT_TIMEOUT:5s}
    response-timeout: ${OCC_DATAMALL_RESPONSE_TIMEOUT:20s}
    traffic-incident-page-size: ${OCC_DATAMALL_TRAFFIC_INCIDENT_PAGE_SIZE:500}
    traffic-incident-max-pages: ${OCC_DATAMALL_TRAFFIC_INCIDENT_MAX_PAGES:10}
    max-response-bytes: ${OCC_DATAMALL_MAX_RESPONSE_BYTES:5000000}
  ingestion:
    monitored-services: ${OCC_INGESTION_MONITORED_SERVICES:190,972}
    stale-after-seconds: ${OCC_INGESTION_STALE_AFTER_SECONDS:180}
    retention: ${OCC_INGESTION_RETENTION:12h}
    schedule:
      bus-arrival-enabled: ${OCC_INGESTION_BUS_ARRIVAL_ENABLED:true}
      bus-arrival-poll-interval: ${OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL:60s}
      bus-arrival-initial-delay: ${OCC_INGESTION_BUS_ARRIVAL_INITIAL_DELAY:60s}
      traffic-incident-enabled: ${OCC_INGESTION_TRAFFIC_INCIDENT_ENABLED:true}
      traffic-incident-poll-interval: ${OCC_INGESTION_TRAFFIC_INCIDENT_POLL_INTERVAL:2m}
      traffic-incident-initial-delay: ${OCC_INGESTION_TRAFFIC_INCIDENT_INITIAL_DELAY:30s}
      retention-interval: ${OCC_INGESTION_RETENTION_INTERVAL:1h}
      retention-initial-delay: ${OCC_INGESTION_RETENTION_INITIAL_DELAY:5m}
    import-reference-on-startup: ${OCC_INGESTION_IMPORT_REFERENCE_ON_STARTUP:true}
    seed-targets-on-startup: ${OCC_INGESTION_SEED_TARGETS_ON_STARTUP:true}
    traffic-feed:
      default-page-size: ${OCC_INGESTION_TRAFFIC_POLL_PAGE_SIZE:100}
      max-page-size: ${OCC_INGESTION_TRAFFIC_POLL_MAX_PAGE_SIZE:250}
    demo:
      scenario: ${OCC_INGESTION_DEMO_SCENARIO:multi-route-bunching-v2}
      seed: ${OCC_INGESTION_DEMO_SEED:190}
      step-interval: ${OCC_INGESTION_DEMO_STEP_INTERVAL:5s}
      bunching-threshold: ${OCC_INGESTION_DEMO_BUNCHING_THRESHOLD:90s}
      disruption-internal-url: ${OCC_DISRUPTION_INTERNAL_URL}
      disruption-control-timeout: ${OCC_INGESTION_DISRUPTION_TIMEOUT:5s}
      planning-internal-url: ${OCC_PLANNING_INTERNAL_URL}
      planning-timeout: ${OCC_INGESTION_PLANNING_TIMEOUT:5s}
    pacing:
      interval: ${OCC_INGESTION_PACING_INTERVAL:10s}
      target-headway: ${OCC_INGESTION_PACING_TARGET_HEADWAY:180s}
      too-close-ratio: ${OCC_INGESTION_PACING_TOO_CLOSE_RATIO:0.5}
      too-far-ratio: ${OCC_INGESTION_PACING_TOO_FAR_RATIO:1.5}
      stale-after: ${OCC_INGESTION_PACING_STALE_AFTER:180s}
      stream-timeout: ${OCC_INGESTION_PACING_STREAM_TIMEOUT:30m}
      max-subscribers: ${OCC_INGESTION_PACING_MAX_SUBSCRIBERS:200}
    route-positions:
      cluster-tolerance-meters: ${OCC_INGESTION_ROUTE_POSITION_CLUSTER_TOLERANCE_M:150}
      max-poll-age-cycles: ${OCC_INGESTION_ROUTE_POSITION_MAX_POLL_AGE_CYCLES:2}
      speed-cap-meters-per-second: ${OCC_INGESTION_ROUTE_POSITION_SPEED_CAP_MPS:16.7}
      uncertainty-meters: ${OCC_INGESTION_ROUTE_POSITION_UNCERTAINTY_M:50}
      circular-projection-speed-meters-per-second: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PROJECTION_SPEED_MPS:7.0}
      circular-projection-minimum-stop-count: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PROJECTION_MIN_STOP_COUNT:3}
      identity-link-distance-meters: ${OCC_INGESTION_ROUTE_POSITION_IDENTITY_LINK_DISTANCE_M:25}
      identity-link-projection-speed-meters-per-second: ${OCC_INGESTION_ROUTE_POSITION_IDENTITY_LINK_PROJECTION_SPEED_MPS:7.0}
      identity-eta-tolerance: ${OCC_INGESTION_ROUTE_POSITION_IDENTITY_ETA_TOLERANCE:20s}
      identity-link-routes: ${OCC_INGESTION_ROUTE_POSITION_IDENTITY_LINK_ROUTES:190:1,190:2}
      coordinated-refresh-boundary-routes: ${OCC_INGESTION_ROUTE_POSITION_COORDINATED_REFRESH_BOUNDARY_ROUTES:190:1}
      refresh-boundary-distance-meters: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_DISTANCE_M:250}
      refresh-boundary-window: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_WINDOW:5s}
      refresh-boundary-allowed-overlap: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_ALLOWED_OVERLAP:250ms}
      refresh-boundary-profile-residual: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_PROFILE_RESIDUAL:75s}
      refresh-boundary-profile-minimum-seconds-per-meter: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_PROFILE_MIN_SECONDS_PER_M:0.02}
      refresh-boundary-profile-maximum-seconds-per-meter: ${OCC_INGESTION_ROUTE_POSITION_REFRESH_BOUNDARY_PROFILE_MAX_SECONDS_PER_M:2.0}
      circular-phase-link-distance-meters: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PHASE_LINK_DISTANCE_M:250}
      circular-phase-maximum-gap-meters: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PHASE_MAXIMUM_GAP_M:2000}
      circular-phase-maximum-eta-error: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PHASE_MAXIMUM_ETA_ERROR:75s}
      circular-phase-link-routes: ${OCC_INGESTION_ROUTE_POSITION_CIRCULAR_PHASE_LINK_ROUTES:972:1}
