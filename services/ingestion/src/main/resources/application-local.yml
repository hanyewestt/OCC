# Maven and IDE runs use services/ingestion as their working directory.
spring:
  config:
    import: "optional:file:../../.env[.properties]"
  datasource:
    # The local fallback is deliberately derived from centralized POSTGRES_* values.
    url: ${OCC_INGESTION_DB_PUBLIC_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:occ}}
occ:
  ingestion:
    demo:
      disruption-internal-url: ${OCC_DISRUPTION_PUBLIC_URL:http://localhost:6768}
