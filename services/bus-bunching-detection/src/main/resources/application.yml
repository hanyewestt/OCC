spring:
  application:
    name: bus-bunching-detection
  main:
    web-application-type: none
  datasource:
    url: ${OCC_BUNCHING_DB_URL}
    username: ${OCC_BUNCHING_DB_USER:occ_bunching}
    password: ${OCC_BUNCHING_DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    default-schema: bunching
    create-schemas: false
    locations: classpath:db/migration

occ:
  bunching:
    consumer-enabled: ${OCC_BUNCHING_CONSUMER_ENABLED:true}
    threshold: ${OCC_BUNCHING_THRESHOLD:90s}
    # Required deployment choice: align with ingestion's configured freshness policy.
    stale-after: ${OCC_BUNCHING_STALE_AFTER:120s}
    poll-interval: ${OCC_BUNCHING_POLL_INTERVAL:1s}
    batch-size: ${OCC_BUNCHING_BATCH_SIZE:100}
    ingestion-base-url: ${OCC_INGESTION_INTERNAL_URL:${OCC_INGESTION_PUBLIC_URL:http://localhost:${OCC_INGESTION_PORT:6767}}}
