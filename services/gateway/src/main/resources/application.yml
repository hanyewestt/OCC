spring:
  application:
    name: gateway
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ingestion-api
              uri: ${OCC_INGESTION_INTERNAL_URL}
              predicates:
                - Path=/api/v1/ingestion/**
              filters:
                - RewritePath=/api/v1/ingestion/(?<remaining>.*), /api/v1/$\{remaining}
            - id: disruption-api
              uri: ${OCC_DISRUPTION_INTERNAL_URL}
              predicates:
                - Path=/api/v1/disruption/**
            - id: planning-api
              uri: ${OCC_PLANNING_INTERNAL_URL}
              predicates:
                - Path=/api/v1/planning/**
            - id: ingestion-root-api
              uri: ${OCC_INGESTION_INTERNAL_URL}
              predicates:
                - Path=/api/v1/{resource:(?!auth$).+}/**
server:
  port: ${OCC_GATEWAY_INTERNAL_PORT}
occ:
  frontend:
    project-url: ${SUPABASE_PROJECT_URL}
    publishable-key: ${SUPABASE_SB_PUBLISHABLE:}
    controller-refresh-interval: ${OCC_CONTROLLER_DATA_REFRESH_INTERVAL:30s}
    ingestion-poll-interval: ${OCC_INGESTION_BUS_ARRIVAL_POLL_INTERVAL}
    route-incident-gap-tolerance: ${OCC_ROUTE_INCIDENT_GAP_TOLERANCE:20s}
    captain-refresh-interval: ${OCC_CAPTAIN_DATA_REFRESH_INTERVAL:5s}
    public-notice-refresh-interval: ${OCC_PUBLIC_NOTICE_REFRESH_INTERVAL:30s}
  security:
    supabase:
      project-url: ${SUPABASE_PROJECT_URL}
      jwks-url: ${SUPABASE_JWKS_URL}
      audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
      clock-skew: ${SUPABASE_JWT_CLOCK_SKEW:30s}
      allowed-algorithms: ${SUPABASE_JWT_ALLOWED_ALGORITHMS:ES256}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
