# Automatically loaded for local development. Production uses explicit -f files.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  db-setup:
    build:
      context: .
      dockerfile: infra/flyway.Dockerfile

  ingestion:
    build:
      context: .
      dockerfile: infra/java.Dockerfile
      args:
        OCC_SERVICE: ingestion
        OCC_SERVICE_INTERNAL_PORT: ${OCC_INGESTION_INTERNAL_PORT:-8001}
    ports:
      - "127.0.0.1:${OCC_INGESTION_PORT:-6767}:${OCC_INGESTION_INTERNAL_PORT:-8001}"

  disruption:
    build:
      context: .
      dockerfile: infra/java.Dockerfile
      args:
        OCC_SERVICE: disruption
        OCC_SERVICE_INTERNAL_PORT: ${OCC_DISRUPTION_INTERNAL_PORT:-8002}
    ports:
      - "127.0.0.1:${OCC_DISRUPTION_PORT:-6768}:${OCC_DISRUPTION_INTERNAL_PORT:-8002}"

  planning:
    build:
      context: .
      dockerfile: infra/java.Dockerfile
      args:
        OCC_SERVICE: planning
        OCC_SERVICE_INTERNAL_PORT: ${OCC_PLANNING_INTERNAL_PORT:-8003}
    ports:
      - "127.0.0.1:${OCC_PLANNING_PORT:-6769}:${OCC_PLANNING_INTERNAL_PORT:-8003}"

  pgadmin:
    # A non-internal network enables Docker's local host-port publishing.
    # Nginx also reaches pgAdmin here without joining the database network.
    networks: [database, edge]
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-6700}:80"

  nginx:
    profiles: !reset []
    environment:
      OCC_PGADMIN_INTERNAL_URL: ${OCC_PGADMIN_INTERNAL_URL:-http://pgadmin:80}
    ports:
      - "127.0.0.1:${OCC_NGINX_PORT:-80}:${OCC_NGINX_HTTP_INTERNAL_PORT:-8080}"
      # Temporary migration shim: tools that still call localhost:6770 reach the
      # edge directly. Retire this mapping with the Gateway port setting.
      - "127.0.0.1:${OCC_GATEWAY_PORT:-6770}:${OCC_NGINX_HTTP_INTERNAL_PORT:-8080}"
    volumes:
      - ./infra/nginx/local.conf.template:/etc/nginx/templates/default.conf.template:ro
