server {
    listen 8080;
    server_tokens off;

    location = /auth/v1/.well-known/jwks.json {
        default_type application/json;
        alias /var/www/jwks.json;
    }

    location ~ ^/v1beta/models/[^/]+:generateContent$ {
        default_type application/json;
        return 200 '{"candidates":[{"content":{"role":"model","parts":[{"text":"{\\\"causeCode\\\":\\\"UNKNOWN\\\",\\\"causeSubtype\\\":null,\\\"likelyCause\\\":null,\\\"supportingEvidenceIds\\\":[],\\\"limitations\\\":[\\\"Synthetic Phase 1 workflow diagnosis.\\\"]}"}]},"finishReason":"STOP","index":0}],"modelVersion":"gemini-3.1-flash-lite","responseId":"local-workflow-test","usageMetadata":{"promptTokenCount":1,"candidatesTokenCount":1,"totalTokenCount":2}}';
    }

    location ~ /BusStops$ {
        default_type application/json;
        if ($args ~ skip=0$) {
            return 200 '{"value":[{"BusStopCode":"44241","RoadName":"Clementi Road","Description":"Opposite Clementi Road","Latitude":"1.3210","Longitude":"103.7720"},{"BusStopCode":"44251","RoadName":"Clementi Road","Description":"Clementi Road","Latitude":"1.3770","Longitude":"103.7710"}]}';
        }
        return 200 '{"value":[]}';
    }

    location ~ /BusServices$ {
        default_type application/json;
        if ($args ~ skip=0$) {
            return 200 '{"value":[{"ServiceNo":"190","Operator":"SBST","Category":"TRUNK"}]}';
        }
        return 200 '{"value":[]}';
    }

    location ~ /BusRoutes$ {
        default_type application/json;
        if ($args ~ skip=0$) {
            return 200 '{"value":[{"ServiceNo":"190","Operator":"SBST","Direction":1,"StopSequence":1,"BusStopCode":"44241","Distance":"0"},{"ServiceNo":"190","Operator":"SBST","Direction":1,"StopSequence":2,"BusStopCode":"44251","Distance":"0.5"}]}';
        }
        return 200 '{"value":[]}';
    }

    location / {
        default_type application/json;
        return 200 '{"value":[]}';
    }
}
